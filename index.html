<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--panel:#0f0f1a;--border:#1a1a2e;--accent:#00f5ff;--accent2:#ff006e;--accent3:#ffbe0b;--text:#e0e0ff;--dim:#555577;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;min-height:100vh;padding:40px 20px;
    background-image:radial-gradient(ellipse at 20% 0%,rgba(0,245,255,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(255,0,110,0.06) 0%,transparent 50%);}
  header{text-align:center;margin-bottom:48px;}
  h1{font-family:'Orbitron',sans-serif;font-size:clamp(28px,6vw,52px);font-weight:900;letter-spacing:0.15em;
    background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    filter:drop-shadow(0 0 24px rgba(0,245,255,0.35));}
  .subtitle{font-size:11px;letter-spacing:0.35em;color:var(--dim);text-transform:uppercase;margin-top:6px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;max-width:900px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px 24px;
    text-decoration:none;color:var(--text);transition:all 0.25s;position:relative;overflow:hidden;}
  .card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,245,255,0.04),transparent);opacity:0;transition:opacity 0.25s;}
  .card:hover{border-color:rgba(0,245,255,0.35);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,245,255,0.1);}
  .card:hover::before{opacity:1;}
  .card-icon{font-size:36px;margin-bottom:14px;}
  .card-title{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;color:var(--accent);margin-bottom:8px;}
  .card-desc{font-size:11px;color:var(--dim);line-height:1.7;}
  .card-tag{display:inline-block;margin-top:12px;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;border:1px solid rgba(0,245,255,0.2);color:rgba(0,245,255,0.6);}
  .scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:100;}
  footer{text-align:center;margin-top:60px;font-size:10px;color:var(--dim);letter-spacing:0.2em;}
</style>
</head>
<body>
<div class="scanline"></div>
<header>
  <h1>ARCADE</h1>
  <div class="subtitle">Coleccion de juegos</div>
</header>
<div class="grid">
  <a class="card" href="juegos/mastermind/">
    <div class="card-icon">🎯</div>
    <div class="card-title">Mastermind</div>
    <div class="card-desc">Descifra el codigo secreto de colores. Logica pura contra el reloj.</div>
    <span class="card-tag">Logica</span>
  </a>
</div>
<footer>ARCADE · Todos los juegos</footer>
</body>
</html>
