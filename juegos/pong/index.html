<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06060e;--border:#1a1a35;--cyan:#00f5ff;--pink:#ff2d78;--gold:#ffc740;--text:#e8e8ff;--dim:#3a3a6a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:var(--text);display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
  .btn-back{position:fixed;top:14px;left:14px;z-index:500;display:inline-flex;align-items:center;gap:7px;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:0.2em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:8px 14px;border-radius:8px;background:rgba(6,6,14,0.85);border:1px solid var(--border);backdrop-filter:blur(8px);}
  .wrap{position:relative;flex:1;width:100%;max-width:440px;margin-top:52px;margin-bottom:52px;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,6,14,0.92);backdrop-filter:blur(4px);z-index:10;}
  .overlay.hidden{display:none;}
  .ov-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,6vw,32px);letter-spacing:0.15em;text-align:center;}
  .ov-sub{font-size:11px;color:var(--dim);letter-spacing:0.15em;text-align:center;line-height:2;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.2em;padding:11px 22px;border-radius:8px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;-webkit-tap-highlight-color:transparent;border:1px solid var(--cyan);background:rgba(0,245,255,0.1);color:var(--cyan);}
  .btn:active{background:rgba(0,245,255,0.22);}
  .btn.p2{border-color:var(--pink);background:rgba(255,45,120,0.1);color:var(--pink);}
  .cfg-row{display:flex;flex-direction:column;gap:6px;width:100%;}
  .cfg-label{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;}
  .cfg-val{color:var(--cyan);margin-left:8px;}
  .cfg-track{display:flex;flex-direction:column;gap:3px;}
  .cfg-track input[type=range]{width:100%;accent-color:var(--cyan);height:4px;cursor:pointer;}
  .cfg-ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:0.1em;padding:0 2px;}
</style>
</head>
<body>
<a class="btn-back" href="../../index.html"><span style="font-size:13px">←</span> Inicio</a>
<div style="position:fixed;top:14px;right:14px;z-index:500;display:flex;gap:8px;">
  <button id="soundBtn" onclick="toggleSound()" style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--dim);background:rgba(6,6,14,0.85);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;backdrop-filter:blur(8px);">🔊</button>
  <button id="pauseBtn" onclick="togglePause()" style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--dim);background:rgba(6,6,14,0.85);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;backdrop-filter:blur(8px);">⏸</button>
</div>
<div id="bottomBar" style="position:fixed;bottom:0;left:0;right:0;z-index:500;height:52px;background:rgba(6,6,14,0.92);border-top:1px solid var(--border);backdrop-filter:blur(8px);"></div>

<script>
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');
const wrap = document.getElementById('wrap');

// WIN is now cfg.winScore
let W, H, PW, PH, BR;
let mode = 1, lastMode = 1;
let running = false, animId = null;

// Game state
let p1x, p2x, s1, s2;
let bx, by, bvx, bvy, bspin=0, bNitroTimer=0, bNitroColor=null, preNitroSpd=0;
const NITRO_DURATION = 674; // 11.23s
const SPIN_NITRO         = 0.85;   // spin multiplier from paddle when nitro active
const SPIN_NORMAL        = 0.3;    // spin multiplier from paddle normal
const SPIN_VEL_NITRO     = 0.015;  // spin-to-bvx transfer during nitro
const SPIN_VEL_NORMAL    = 0.012;  // spin-to-bvx transfer normal
const SPIN_DECAY_NITRO   = 0.992;  // spin decay factor during nitro
const SPIN_DECAY_NORMAL  = 0.97;   // spin decay factor normal
const SPIN_WALL_DECAY    = 0.40;   // spin fraction remaining after wall bounce
const HIT_FLASH_DECAY    = 0.07;   // p1/p2HitFlash decay per frame
const NITRO_IMPACT_DECAY = 0.04;   // p1/p2NitroImpact decay per frame
const NITRO_WIDTH_LERP   = 0.08;   // paddle width interpolation factor
const NITRO_WIDTH_SCALE  = 0.35;   // extra paddle width multiplier during nitro
const WALL_NITRO_BOOST   = 1.05;   // speed multiplier when nitro ball hits wall
const WALL_NITRO_ANGLE   = 0.78;   // |bvx| reduction factor for tighter wall angle

// ── CONFIG ──
let cfg = {
  difficulty: 3,    // 1-5
  maxBlocks: 0,     // 0-4 static blocks
  nitroCount: 6,    // 0-6 nitro orbs
  nitroAt: 8,       // rally count to spawn nitros
  ballColor: '#c8a8f0',
  winScore: 7,
  dynamicBlock: true,
  dynamicAt: 30
};
let dyingBlocks = [], nitroTrail = [], ballTrail = [], stars = [], floatingNums = [], horizPulse = 0, colorTime = 0, nitroWarning = false, nitroWarnPositions = [];
let wallFlashLeft = 0, wallFlashRight = 0; // 0..1, flash on side wall hit
let wallNitroFlowOffset = 0;
let _hue = 280, _bgS = 60; // updated each frame by drawBackground, used by draw()
let bgStyle = 0; // 0=Synthwave, 1=Deep Space, 2=Matrix, 3=Lava
// Nitro impact screen effects
let nitroHitFlash = 0, nitroHitColor = '#fff'; // full-screen flash on nitro collision
let shakeMag = 0, shakeX = 0, shakeY = 0;      // screen shake on nitro collision

// Adaptive difficulty
let adaptiveDiff = 3.0; // float 1-5
// Goal flash
let goalFlashTimer = 0, goalFlashColor = '#ffffff';
// Survival mode
let survivalMode = false, survivalSpeed = 1.0, survivalTimer = 0, survivalBest = 0;
// Records (localStorage)
let records = { wins: 0, maxRally: 0, survivalBest: 0 };
try { const r = JSON.parse(localStorage.getItem('pongRecords')||'{}'); Object.assign(records, r); } catch(e){}
function saveRecords() { try { localStorage.setItem('pongRecords', JSON.stringify(records)); } catch(e){} }

let state = 'idle'; // idle | playing | goal | ended
let rally = 0; // hit counter
let obstacles = []; // {x,y,w,h}
let boostZones = []; // {y1,y2, factor}
const RALLY_THRESHOLD = 10;
const NITRO_WARN_BEFORE = 3; // seconds before nitros appear
let goalTimer = 0;
let goalScorer = 0; // 1 or 2
let particles = [];
let p1vel = 0, p2vel = 0, p2Error = 0, p2ErrorTimer = 0; // paddle velocity for angle control
let p1NitroWidth = 0, p2NitroWidth = 0; // extra width during nitro (0..1)
let p1HitFlash = 0, p2HitFlash = 0; // hit flash timer (0..1)
let p1NitroImpact = 0, p2NitroImpact = 0; // 0..1, electric shock visual
let prevP1x, prevP2x;

// Touch tracking
let t1id = null, t1x = 0; // player1 touch
let t2id = null, t2x = 0; // player2 touch (2P mode)

function resize() {
  W = Math.min(window.innerWidth, 440);
  H = window.innerHeight - 52;
  gc.width = W; gc.height = H;
  wrap.style.height = H + 'px';
  PW = Math.round(W * 0.18);
  PH = Math.round(H * 0.012);
  BR = Math.round(W * 0.026);
}

function startGame(m) {
  mode = m; lastMode = m;
  if (!survivalMode) { survivalSpeed = 1.0; survivalTimer = 0; }
  adaptiveDiff = cfg.difficulty;
  resize();
  s1 = 0; s2 = 0;
  p1x = W/2 - PW/2;
  p2x = W/2 - PW/2;
  prevP1x = p1x; prevP2x = p2x;
  p1vel = 0; p2vel = 0; p2Error = 0; p2ErrorTimer = 0;
  p1NitroWidth = 0; p2NitroWidth = 0; p1HitFlash = 0; p2HitFlash = 0; p1NitroImpact = 0; p2NitroImpact = 0;
  particles = []; rally = 0; obstacles = []; boostZones = []; dyingBlocks = []; nitroTrail = []; ballTrail = []; floatingNums = []; paused = false;
  nitroHitFlash = 0; shakeMag = 0; shakeX = 0; shakeY = 0;
  initStars(); document.getElementById('pauseBtn').textContent='⏸';
  hideOverlays();
  running = true;
  startBgm();
  loadNitroAudio(false); // preload
  setState('idle', 2); // ball starts at p2 (top = opponent), p1 serves first? no - loser serves
  // First serve: p1 serves (bottom)
  setBallAt(1);
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function setBallAt(who) {
  // Place ball on paddle of `who`, waiting for movement
  if (who === 1) {
    bx = p1x + PW/2;
    by = H - PH - Math.round(H*0.10) - BR - 2;
  } else {
    bx = p2x + PW/2;
    by = Math.round(H*0.04) + PH + BR + 2;
  }
  bvx = 0; bvy = 0; bspin = 0;
  if (bNitroTimer > 0) { stopNitroSound(); bNitroTimer = 0; bNitroColor = null; preNitroSpd = 0; }
  state = 'idle';
  goalTimer = 0;
}

function launchFrom(who, angle) {
  const spd = H * 0.0048;
  bvx = Math.cos(angle) * spd;
  bvy = (who === 1) ? -Math.abs(Math.sin(angle) * spd) : Math.abs(Math.sin(angle) * spd);
  if (Math.abs(bvy) < spd * 0.3) bvy = (who === 1 ? -1 : 1) * spd * 0.5;
  state = 'playing';
}

function setState(s, who) { state = s; }

// ── LOOP ──
function loop() {
  if (!running || paused) return;
  try {
    update();
  } catch(e) {
    console.error('ERROR en update():', e.message, e.stack);
    running = false; return;
  }
  try {
    draw();
  } catch(e) {
    console.error('ERROR en draw():', e.message, e.stack);
    running = false; return;
  }
  animId = requestAnimationFrame(loop);
}

function update() {
  const p1y = H - PH - Math.round(H*0.10);
  const p2y = Math.round(H*0.04);

  // Effective paddle widths (includes nitro expansion)
  const p1ExtraW = p1NitroWidth * PW * NITRO_WIDTH_SCALE;
  const p2ExtraW = p2NitroWidth * PW * NITRO_WIDTH_SCALE;
  const p1EffW = PW + p1ExtraW;
  const p2EffW = PW + p2ExtraW;
  const p1EffX = p1x - p1ExtraW / 2;
  const p2EffX = p2x - p2ExtraW / 2;

  // Track paddle velocity
  p1vel = p1x - prevP1x;
  p2vel = p2x - prevP2x;
  prevP1x = p1x;
  prevP2x = p2x;

  if (state === 'goal') {
    goalTimer--;
    // Animate particles
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.02;
      return p.life > 0;
    });
    if (goalTimer <= 0) {
      // Give ball to loser
      setBallAt(goalScorer === 1 ? 2 : 1);
    }
    return;
  }

  if (state === 'idle') {
    // Ball follows paddle
    if (goalScorer === 0 || goalScorer === 2) {
      // p1 has ball
      bx = p1x + PW/2;
      by = p1y - BR - 2;
      // launch when p1 moves
      if (Math.abs(p1vel) > 1.5) {
        const angle = Math.atan2(-1, p1vel * 0.6 + (Math.random()-0.5)*0.3);
        launchFrom(1, angle);
      }
    } else {
      // p2 has ball
      bx = p2x + PW/2;
      by = p2y + PH + BR + 2;
      if (mode === 1) {
        // AI launches after short delay - move p2 toward center then launch
        p2x += (W/2 - PW/2 - p2x) * 0.03;
        const timer = Math.random();
        if (timer < 0.015) {
          const angle = Math.atan2(1, (Math.random()-0.5)*0.8);
          launchFrom(2, angle);
        }
      } else {
        if (Math.abs(p2vel) > 1.5) {
          const angle = Math.atan2(1, p2vel * 0.6 + (Math.random()-0.5)*0.3);
          launchFrom(2, angle);
        }
      }
    }
    return;
  }

  // AI for p2 in 1P mode
  if (mode === 1) {
    const center = p2x + PW/2;
    // Adaptive difficulty: float 1-5 blended continuously
    const ad = Math.max(1, Math.min(5, adaptiveDiff));
    const t = (ad - 1) / 4; // 0..1
    // speed
    const aiSpeed = W * (0.004 + t * 0.024);
    // reaction zone
    const reactionZone = H * (0.25 + t * 0.75);
    // error amount
    const errorAmount = PW * (1.2 - t * 1.2);

    // add random error that changes slowly
    if (!p2ErrorTimer || p2ErrorTimer <= 0) {
      p2Error = (Math.random() * 2 - 1) * errorAmount;
      p2ErrorTimer = 20 + Math.floor(Math.random() * 40);
    }
    p2ErrorTimer--;

    if (bvy < 0 && by < reactionZone) {
      const target = bx + p2Error;
      if (center < target - 6) p2x = Math.min(W-PW, p2x + aiSpeed);
      else if (center > target + 6) p2x = Math.max(0, p2x - aiSpeed);
    } else {
      // drift back to center slowly
      p2x += (W/2 - PW/2 - p2x) * 0.02;
    }
  }

  // Move ball
  bvx += bspin * (bNitroTimer > 0 ? SPIN_VEL_NITRO : SPIN_VEL_NORMAL);
  // slower spin decay during nitro for sustained curve
  bspin *= bNitroTimer > 0 ? SPIN_DECAY_NITRO : SPIN_DECAY_NORMAL;
  // Nitro decay
  if (bNitroTimer > 0) {
    bNitroTimer--;
    if (bNitroTimer === 0) {
      bNitroColor = null; preNitroSpd = 0;
      stopNitroSound();
    }
  }
  // Paddle nitro width interpolation
  const p1NitroActive = bNitroTimer > 0 && bNitroColor === '#00f5ff';
  const p2NitroActive = bNitroTimer > 0 && bNitroColor === '#ff2d78';
  const _p1Target = p1NitroActive ? 1 : 0;
  const _p2Target = p2NitroActive ? 1 : 0;
  p1NitroWidth = Math.max(0, Math.min(1, p1NitroWidth + (_p1Target - p1NitroWidth) * NITRO_WIDTH_LERP));
  p2NitroWidth = Math.max(0, Math.min(1, p2NitroWidth + (_p2Target - p2NitroWidth) * NITRO_WIDTH_LERP));
  p1HitFlash = Math.max(0, p1HitFlash - HIT_FLASH_DECAY);
  p2HitFlash = Math.max(0, p2HitFlash - HIT_FLASH_DECAY);
  wallFlashLeft  = Math.max(0, wallFlashLeft  - 0.12);
  wallFlashRight = Math.max(0, wallFlashRight - 0.12);
  wallNitroFlowOffset = (wallNitroFlowOffset + (bNitroTimer > 0 ? 0.018 : 0)) % 1;
  p1NitroImpact = Math.max(0, p1NitroImpact - NITRO_IMPACT_DECAY);
  p2NitroImpact = Math.max(0, p2NitroImpact - NITRO_IMPACT_DECAY);
  bx += bvx; by += bvy;

  // Survival mode: increase speed over time
  if (survivalMode && state === 'playing') {
    survivalTimer++;
    // Speed up every 5 seconds (300 frames)
    survivalSpeed = 1.0 + (survivalTimer / 300) * 0.12;
  }

  // Side walls
  if (bx - BR < 0) { bx = BR; bvx = Math.abs(bvx); bspin *= SPIN_WALL_DECAY; sndWall(); wallFlashLeft = 1.0;
    if (bNitroTimer > 0 && bNitroColor !== null) {
      const isCyan = bNitroColor === '#00f5ff';
      const towardOpponent = isCyan ? (bvy < 0) : (bvy > 0);
      if (towardOpponent) {
        const spd = Math.sqrt(bvx*bvx+bvy*bvy) * WALL_NITRO_BOOST;
        const newBvxAbs = Math.abs(bvx) * WALL_NITRO_ANGLE;
        const newBvyAbs = Math.sqrt(Math.max(0, spd*spd - newBvxAbs*newBvxAbs));
        bvx = Math.sign(bvx) * newBvxAbs;
        bvy = Math.sign(bvy) * newBvyAbs;
        capSpeed();
      }
    }
  }
  if (bx + BR > W) { bx = W - BR; bvx = -Math.abs(bvx); bspin *= SPIN_WALL_DECAY; sndWall(); wallFlashRight = 1.0;
    if (bNitroTimer > 0 && bNitroColor !== null) {
      const isCyan = bNitroColor === '#00f5ff';
      const towardOpponent = isCyan ? (bvy < 0) : (bvy > 0);
      if (towardOpponent) {
        const spd = Math.sqrt(bvx*bvx+bvy*bvy) * WALL_NITRO_BOOST;
        const newBvxAbs = Math.abs(bvx) * WALL_NITRO_ANGLE;
        const newBvyAbs = Math.sqrt(Math.max(0, spd*spd - newBvxAbs*newBvxAbs));
        bvx = Math.sign(bvx) * newBvxAbs;
        bvy = Math.sign(bvy) * newBvyAbs;
        capSpeed();
      }
    }
  }

  // P1 paddle (bottom) - physics deflection
  if (bvy > 0 && by+BR >= p1y && by+BR <= p1y+PH+8 && bx >= p1EffX-4 && bx <= p1EffX+p1EffW+4) {
    const rel = (bx - (p1EffX + p1EffW/2)) / (p1EffW/2);
    const velInfluence = p1vel * 0.06;
    const deflect = Math.max(-1, Math.min(1, rel * 0.85 + velInfluence));
    const spd = Math.sqrt(bvx*bvx+bvy*bvy) * 1.04;
    const maxAngle = Math.PI * 0.38;
    const angle = deflect * maxAngle;
    bvx = Math.sin(angle) * spd;
    bvy = -Math.cos(angle) * spd;
    if (Math.abs(bvy) < spd*0.2) bvy = -spd*0.3;
    by = p1y - BR - 1;
    bspin = p1vel * (p1NitroActive ? SPIN_NITRO : SPIN_NORMAL);
    p1HitFlash = 1.0;
    capSpeed();
    const _p1IsFirstBurst = bNitroTimer > NITRO_DURATION - 48;
    if (_p1IsFirstBurst && p2NitroActive) {

      nitroHitFlash = 1.0; nitroHitColor = '#ff2d78';

  // P2 paddle (top) - physics deflection
  if (bvy < 0 && by-BR <= p2y+PH && by-BR >= p2y-8 && bx >= p2EffX-4 && bx <= p2EffX+p2EffW+4) {
    const rel = (bx - (p2EffX + p2EffW/2)) / (p2EffW/2);
    const velInfluence = p2vel * 0.06;
    const deflect = Math.max(-1, Math.min(1, rel * 0.85 + velInfluence));
    const spd = Math.sqrt(bvx*bvx+bvy*bvy) * 1.04;
    const maxAngle = Math.PI * 0.38;
    const angle = deflect * maxAngle;
    bvx = Math.sin(angle) * spd;
    bvy = Math.cos(angle) * spd;
    if (Math.abs(bvy) < spd*0.2) bvy = spd*0.3;
    by = p2y + PH + BR + 1;
    bspin = p2vel * (p2NitroActive ? SPIN_NITRO : SPIN_NORMAL);
    p2HitFlash = 1.0;
    capSpeed();
    const _p2IsFirstBurst = bNitroTimer > NITRO_DURATION - 48;
    if (_p2IsFirstBurst && p1NitroActive) {
      p2NitroImpact = 1.0;
      nitroHitFlash = 1.0; nitroHitColor = '#00f5ff';

  checkObstacles();

  if (by > H + BR) { goal(2); return; }
  if (by < -BR)    { goal(1); return; }
}

function goal(scorer) {
  stopNitroSound(); bNitroTimer=0; bNitroColor=null;
  const gyFloat = scorer===1 ? H*0.75 : H*0.25;
  addFloatingNum(W/2, gyFloat, scorer===1?'+1':'+1', scorer===1?'#00f5ff':'#ff2d78');
  try{navigator.vibrate(scorer===1?[80,30,120]:[200]);}catch(e){}
  rally = 0; obstacles = []; boostZones = [];
  if (scorer === 1) { s1++; sndGoal(); } else { s2++; sndLose(); }

  // Goal flash
  goalFlashTimer = 8;
  goalFlashColor = scorer===1 ? '#00f5ff' : '#ff2d78';

  // Adaptive difficulty: if player winning → harder, if losing → easier
  if (mode === 1) {
    const diff = s1 - s2; // positive = player winning
    adaptiveDiff += diff > 0 ? 0.25 : -0.20;
    adaptiveDiff = Math.max(1.0, Math.min(5.0, adaptiveDiff));
  }

  goalScorer = scorer;
  state = 'goal';
  goalTimer = 120; // 2 seconds at 60fps
  p1NitroWidth = 0; p2NitroWidth = 0; p1HitFlash = 0; p2HitFlash = 0; p1NitroImpact = 0; p2NitroImpact = 0;

  // Big burst of particles at the scoring side
  const gy = scorer === 1 ? H * 0.15 : H * 0.85;
  const color = scorer === 1 ? '#00f5ff' : (mode===2?'#ff2d78':'#ffc740');
  // no particles

  if (survivalMode && scorer === 2) {
    // In survival, if opponent scores it's game over
    goalTimer = 180;
    setTimeout(() => endGame(2), 3000);
  } else if (!survivalMode && (s1 >= cfg.winScore || s2 >= cfg.winScore)) {
    goalTimer = 180;
    setTimeout(() => endGame(scorer), 3000);
  }
}

function onRallyHit() {
  rally++;
  if (rally === RALLY_THRESHOLD) spawnObstacles();
  if (rally === cfg.nitroAt - 1) startNitroWarning();
  if (rally === cfg.nitroAt) { nitroWarning = false; spawnBoostZones(); }
  if (cfg.dynamicBlock && rally === cfg.dynamicAt) spawnMovingBlock();
  if (rally > 0 && rally % 14 === 0) {
    spawnObstacles(); // adds one if under limit
  }
}


function spawnMovingBlock() {
  if (obstacles.some(o => o.moving)) return;
  const ow = Math.round(W * 0.14);
  const oh = Math.round(H * 0.022); // slightly taller = more robust
  const _p2y = Math.round(H * 0.04);
  const _p1y = H - PH - Math.round(H * 0.10);
  const fieldCenterY = (_p2y + PH + _p1y) / 2;
  obstacles.push({
    x: W/2 - ow/2, y: fieldCenterY - oh/2,
    w: ow, h: oh,
    color: '#7c3aed',    // metallic violet base
    colorHi: '#a78bfa',  // highlight
    colorSh: '#2e1065',  // shadow
    flash: 0,
    ghost: 1.0,
    moving: true,
    vx: W * 0.003 * (Math.random()<0.5?1:-1),  // visible start speed
    maxVx: W * 0.013   // max speed cap
  });
}

function spawnObstacles() {
  const fixed = obstacles.filter(o => !o.moving);
  if (fixed.length >= cfg.maxBlocks || cfg.maxBlocks === 0) return;
  const ow = Math.round(W * 0.12), oh = Math.round(H * 0.015);
  const minDistNitro = W * 0.18; // min distance from any nitro
  let nx, ny, tries = 0, ok = false;
  while (tries < 40) {
    nx = W * (0.1 + Math.random() * 0.8) - ow/2;
    ny = H * (0.22 + Math.random() * 0.56) - oh/2;
    const cx = nx + ow/2, cy = ny + oh/2;
    // check distance from all nitros
    const tooCloseNitro = boostZones.some(z => Math.hypot(cx-z.x, cy-z.y) < minDistNitro);
    // check distance from other blocks
    const tooCloseBlock = obstacles.some(o => Math.abs(cx-(o.x+o.w/2)) < ow*2.5 && Math.abs(cy-(o.y+o.h/2)) < H*0.18);
    if (!tooCloseNitro && !tooCloseBlock) { ok = true; break; }
    tries++;
  }
  if (!ok) return; // couldn't find a valid spot
  obstacles.push({x:nx, y:ny, w:ow, h:oh, color:'#ffc740', flash:0, ghost:1.0});
}

function startNitroWarning() {
  nitroWarning = true;
  // Pre-calculate where nitros will appear based on current cfg
  nitroWarnPositions = [];
  const r = Math.round(W * 0.048);
  const y1C = H * 0.62, y1S = H * 0.72, y2C = H * 0.38, y2S = H * 0.28;

    3:[{color:'#00f5ff',x:xC,y:y1C},{color:'#ff2d78',x:xL,y:y2S},{color:'#ff2d78',x:xR,y:y2S}],

    5:[{color:'#00f5ff',x:xC,y:y1C},{color:'#00f5ff',x:xL,y:y1S},{color:'#00f5ff',x:xR,y:y1S},{color:'#ff2d78',x:xC,y:y2C},{color:'#ff2d78',x:xL,y:y2S}],

  };
  nitroWarnPositions = (defs[Math.min(cfg.nitroCount,6)] || defs[2]).map((d,i) => ({...d, pulse:i*0.5}));
}

function drawNitroWarning() {
  if (!nitroWarning || boostZones.length > 0) return;
  nitroWarnPositions.forEach(z => {
    z.pulse += 0.025; // slower pulse
    const t = Math.abs(Math.sin(z.pulse));
    const ringR = Math.round(W*0.048) * (0.9 + 0.8*t);

function spawnBoostZones() {
  boostZones = [];
  if (cfg.nitroCount === 0) return;
  const r = Math.round(W * 0.048);
  // Fixed positions per count
  // team1=cyan bottom (y=0.68H), team2=pink top (y=0.32H)
  const y1 = H * 0.68, y2 = H * 0.32;

  // y offsets: center nitro is more "advanced" (closer to center of field)

  const configs = {

        {team:2,color:'#ff2d78',x:xL,y:y2S},  // left side: further
        {team:2,color:'#ff2d78',x:xR,y:y2S}], // right side: further

        {team:1,color:'#00f5ff',x:xR,y:y1S},
        {team:2,color:'#ff2d78',x:xL,y:y2S},
        {team:2,color:'#ff2d78',x:xR,y:y2S}],
    5: [{team:1,color:'#00f5ff',x:xC,y:y1C},
        {team:1,color:'#00f5ff',x:xL,y:y1S},
        {team:1,color:'#00f5ff',x:xR,y:y1S},
        {team:2,color:'#ff2d78',x:xC,y:y2C},
        {team:2,color:'#ff2d78',x:xL,y:y2S}],

        {team:1,color:'#00f5ff',x:xL,y:y1S},
        {team:1,color:'#00f5ff',x:xR,y:y1S},

function checkObstacles() {
  obstacles = obstacles.filter(o => {
    // ghost fade in
    if (o.ghost > 0) { o.ghost -= 0.012; if (o.ghost < 0) o.ghost = 0; }
    // no collision while ghosting
    if (!o.ghost || o.ghost < 0.05) {
      if (bx+BR > o.x && bx-BR < o.x+o.w && by+BR > o.y && by-BR < o.y+o.h) {

        if (bNitroTimer > 0) {
          // nitro: pass through if attacking in correct direction, else bounce normally
          const cyanAttacks = bNitroColor === '#00f5ff' && bvy < 0;
          const pinkAttacks = bNitroColor === '#ff2d78' && bvy > 0;
          if (cyanAttacks || pinkAttacks) {
            return true; // pass through - no collision, block stays
          }
          // wrong direction: normal bounce (no destroy)
        }
        const overlapL = (bx+BR) - o.x;
        const overlapR = (o.x+o.w) - (bx-BR);
        const overlapT = (by+BR) - o.y;
        const overlapB = (o.y+o.h) - (by-BR);
        const minO = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minO === overlapT || minO === overlapB) {
          bvy *= -1;
          // push out vertically to prevent sticking
          if (bvy > 0) by = o.y + o.h + BR + 1;
          else by = o.y - BR - 1;
          bspin += (Math.random()-0.5)*2;
        } else {
          bvx *= -1;
          // push out horizontally
          if (bvx > 0) bx = o.x + o.w + BR + 1;
          else bx = o.x - BR - 1;
        }
        capSpeed(); sndWall();
        o.flash = 8;
        if (o.moving) { const _spd = Math.abs(o.vx) * 1.18; o.vx = Math.sign(o.vx) * Math.min(_spd, o.maxVx); }
      }
    }
    if (o.flash > 0) o.flash--;
    if (o.moving) {
      o.x += o.vx;
      if (o.x < 0) { o.x = 0; o.vx = Math.abs(o.vx); }
      if (o.x + o.w > W) { o.x = W - o.w; o.vx = -Math.abs(o.vx); }
    }
    return true; // stay forever until fire destroys
  });
}

function checkBoostZones() {
  boostZones.forEach(z => {
    z.pulse += 0.07;
    // fade in/out opacity
    if (z.cooldown > 0) {
      z.opacity = Math.max(0.15, z.opacity - 0.015);
    } else {
      z.opacity = Math.min(1, (z.opacity||0) + 0.018);
    }
    // cooldown so same orb doesn't trigger repeatedly
    if (z.cooldown > 0) { z.cooldown--; return; }
    if (bNitroTimer > 0 && bNitroColor !== null) return; // already has nitro
    if (Math.hypot(bx - z.x, by - z.y) < z.r + BR) {
      const hitter = bvy < 0 ? 1 : 2;
      const spd = Math.sqrt(bvx*bvx+bvy*bvy);
      const isSameTeam = hitter === z.team;
      if (isSameTeam) {
        const target = Math.min(spd * 1.18, H * 0.013);
        bvx *= target/spd; bvy *= target/spd;
        preNitroSpd = Math.sqrt(bvx*bvx+bvy*bvy);
      preNitroSpd = Math.sqrt(bvx*bvx+bvy*bvy);
      bNitroTimer = NITRO_DURATION;
      bNitroColor = z.color;
      // boost + slight curve deflection on pickup
      const _spd = Math.sqrt(bvx*bvx+bvy*bvy);
      if (_spd > 0) {
        bvx *= 1.6; bvy *= 1.6;
        // small curve: deflect angle by 15-25 degrees toward center
        const curveAngle = (Math.random() * 0.18 + 0.12) * (bx < W/2 ? 1 : -1);
        const cos = Math.cos(curveAngle), sin = Math.sin(curveAngle);
        const nvx = bvx*cos - bvy*sin;
        const nvy = bvx*sin + bvy*cos;
        bvx = nvx; bvy = nvy;
        // add gentle persistent spin so path curves subtly
        bspin = (Math.random()*2.2 + 1.4) * (bx < W/2 ? 1 : -1);
      }
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
      // Power-up explosion sound - big dramatic hit then rising sweep
      sndNitroExplosion(z.color);
      startNitroSound();
      } else {
        // wrong team - no effect
      }
      z.cooldown = 60;
    }
  });
}


function capSpeed() {
  const spd = Math.sqrt(bvx*bvx+bvy*bvy);
  const max = H * 0.011 * (survivalMode ? survivalSpeed : 1.0);
  if (spd > max) { bvx=bvx/spd*max; bvy=bvy/spd*max; }
}

    ctx.fillStyle=horizG; ctx.fillRect(0,0,W,H);
    ctx.save();

    const roadG2=ctx.createLinearGradient(0,0,0,vp.y);

    ctx.fillStyle=roadG2; ctx.beginPath(); ctx.moveTo(vp.x,vp.y); ctx.lineTo(0,0); ctx.lineTo(W,0); ctx.closePath(); ctx.fill();
    const nL=8;
    for(let i=0;i<=nL;i++){const tx=(i/nL)*W,a=0.06+(i===0||i===nL?0.08:0);ctx.strokeStyle=`rgba(0,245,255,${a})`;ctx.lineWidth=i===0||i===nL?1.5:0.8;ctx.shadowColor='#00f5ff';ctx.shadowBlur=i===0||i===nL?6:0;ctx.beginPath();ctx.moveTo(vp.x,vp.y);ctx.lineTo(tx,H);ctx.stroke();}
    for(let i=0;i<=nL;i++){const tx=(i/nL)*W,a=0.06+(i===0||i===nL?0.08:0);ctx.strokeStyle=`rgba(255,45,120,${a})`;ctx.lineWidth=i===0||i===nL?1.5:0.8;ctx.shadowColor='#ff2d78';ctx.shadowBlur=i===0||i===nL?6:0;ctx.beginPath();ctx.moveTo(vp.x,vp.y);ctx.lineTo(tx,0);ctx.stroke();}
    ctx.shadowBlur=0;
    const hLC=7;
    const halfBot=fBot-vp.y, halfTop=vp.y-fTop;
    for(let i=0;i<hLC;i++){const t=(i+1)/(hLC+1),y=vp.y+halfBot*t,sp=t*W*0.5+W*0.05,a=(1-t)*0.12+0.03;ctx.strokeStyle=`rgba(0,245,255,${a})`;ctx.lineWidth=t*1.5+0.3;ctx.beginPath();ctx.moveTo(W/2-sp,y);ctx.lineTo(W/2+sp,y);ctx.stroke();}
    for(let i=0;i<hLC;i++){const t=(i+1)/(hLC+1),y=vp.y-halfTop*t,sp=t*W*0.5+W*0.05,a=(1-t)*0.12+0.03;ctx.strokeStyle=`rgba(255,45,120,${a})`;ctx.lineWidth=t*1.5+0.3;ctx.beginPath();ctx.moveTo(W/2-sp,y);ctx.lineTo(W/2+sp,y);ctx.stroke();}
    ctx.restore();
    drawStars();
    if(horizPulse>0) horizPulse-=0.04;
    const hA=0.5+horizPulse*0.5, hB=12+horizPulse*20;
    ctx.save(); const hHue=(hue+180)%360;
    ctx.strokeStyle=`hsla(${hHue},100%,60%,${hA})`; ctx.lineWidth=1.5+horizPulse*2;
    ctx.shadowColor=`hsl(${hHue},100%,60%)`; ctx.shadowBlur=hB;
    ctx.beginPath(); ctx.moveTo(0,horizY); ctx.lineTo(W,horizY); ctx.stroke();
    ctx.restore();

  } else if (style === 1) {
    // ── DEEP SPACE ──
    ctx.fillStyle='#000008'; ctx.fillRect(0,0,W,H);
    // Nebula clouds
    const t1=(Math.sin(ct*0.008)+1)/2, t2=(Math.sin(ct*0.005+1)+1)/2;
    const neb1=ctx.createRadialGradient(W*0.3,H*0.35,0,W*0.3,H*0.35,W*0.5);
    neb1.addColorStop(0,`rgba(80,0,160,${0.08+t1*0.05})`); neb1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=neb1; ctx.fillRect(0,0,W,H);
    const neb2=ctx.createRadialGradient(W*0.7,H*0.65,0,W*0.7,H*0.65,W*0.45);
    neb2.addColorStop(0,`rgba(0,60,140,${0.07+t2*0.04})`); neb2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=neb2; ctx.fillRect(0,0,W,H);
    // Star clusters — dense and varied
    drawStars();
    // Extra twinkle stars
    ctx.save();
    const twinkle=Math.sin(ct*0.05)*0.3+0.7;
    stars.filter((_,i)=>i%4===0).forEach(s=>{
      ctx.globalAlpha=s.brightness*twinkle;
      ctx.fillStyle='#aaddff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.size*1.5,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1; ctx.restore();
    // Subtle cyan/purple grid
    ctx.save(); ctx.strokeStyle='rgba(80,0,200,0.06)'; ctx.lineWidth=0.5;
    for(let gx=0;gx<W;gx+=W/10){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
    for(let gy=0;gy<H;gy+=W/10){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
    ctx.restore();

  } else if (style === 2) {
    // ── MATRIX / CYBER RAIN ──
    ctx.fillStyle='#000a00'; ctx.fillRect(0,0,W,H);
    // Green scanline tint
    const matG=ctx.createLinearGradient(0,0,0,H);
    matG.addColorStop(0,'rgba(0,30,0,0.4)'); matG.addColorStop(0.5,'rgba(0,15,0,0.2)'); matG.addColorStop(1,'rgba(0,30,0,0.4)');
    ctx.fillStyle=matG; ctx.fillRect(0,0,W,H);
    // Vertical falling code columns (very faint)
    ctx.save();
    const colW=Math.round(W/18);
    for(let c=0;c<18;c++){
      const phase=(ct*0.8+c*1.7)%H;
      const alpha=0.04+0.03*(c%3===0?1:0);
      const grad=ctx.createLinearGradient(0,phase-H*0.3,0,phase);
      grad.addColorStop(0,'rgba(0,255,70,0)'); grad.addColorStop(0.7,`rgba(0,255,70,${alpha})`); grad.addColorStop(1,'rgba(0,255,70,0)');
      ctx.fillStyle=grad; ctx.fillRect(c*colW,phase-H*0.3,colW-1,H*0.3);
    }
    ctx.restore();
    // Subtle horizontal scan
    ctx.save();
    const scanY=((ct*40)%H);
    const scanGrad=ctx.createLinearGradient(0,scanY-20,0,scanY+20);
    scanGrad.addColorStop(0,'rgba(0,255,70,0)'); scanGrad.addColorStop(0.5,'rgba(0,255,70,0.04)'); scanGrad.addColorStop(1,'rgba(0,255,70,0)');
    ctx.fillStyle=scanGrad; ctx.fillRect(0,scanY-20,W,40);
    ctx.restore();
    drawStars();

  } else if (style === 3) {
    // ── LAVA / MAGMA ──
    const pulse=(Math.sin(ct*0.015)+1)/2;
    const hBase=10+pulse*15; // shift between red-orange
    ctx.fillStyle=`hsl(${hBase},80%,4%)`; ctx.fillRect(0,0,W,H);
    // Lava glow patches
    const lava1=ctx.createRadialGradient(W*0.2,H*0.7,0,W*0.2,H*0.7,W*0.55);
    lava1.addColorStop(0,`rgba(255,60,0,${0.08+pulse*0.06})`); lava1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lava1; ctx.fillRect(0,0,W,H);
    const lava2=ctx.createRadialGradient(W*0.8,H*0.3,0,W*0.8,H*0.3,W*0.5);
    lava2.addColorStop(0,`rgba(255,100,0,${0.06+pulse*0.04})`); lava2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lava2; ctx.fillRect(0,0,W,H);
    const lava3=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,W*0.4);
    lava3.addColorStop(0,`rgba(200,20,0,${0.04+pulse*0.03})`); lava3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lava3; ctx.fillRect(0,0,W,H);
    // Crack lines
    ctx.save(); ctx.strokeStyle=`rgba(255,80,0,${0.06+pulse*0.04})`; ctx.lineWidth=0.8;
    [[0.1,0.2,0.4,0.6],[0.6,0.1,0.9,0.5],[0.3,0.7,0.7,0.9],[0.5,0.3,0.2,0.8],[0.8,0.6,0.5,0.95]].forEach(([x1,y1,x2,y2])=>{
      ctx.beginPath(); ctx.moveTo(x1*W,y1*H); ctx.lineTo(x2*W,y2*H); ctx.stroke();
    });
    ctx.restore();
    drawStars();
  }

  // Common post-processing: scanlines + vignette
  ctx.save();
  for(let y=0;y<H;y+=3){ctx.fillStyle='rgba(0,0,0,0.07)';ctx.fillRect(0,y,W,1);}
  ctx.restore();
  const vigG=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
  vigG.addColorStop(0,'rgba(0,0,0,0)'); vigG.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vigG; ctx.fillRect(0,0,W,H);
}

// ── PADDLE DRAWING (shared for P1 and P2) ──
function drawPaddle(px, py, pvel, pNitroWidth, pHitFlash, pNitroImpact, nitroColor) {
  const impactRingColor = nitroColor === '#ff2d78' ? '#00f5ff' : '#ff2d78';
  const darkBodyA = nitroColor === '#ff2d78' ? 'rgba(60,0,20,0.97)' : 'rgba(0,40,55,0.97)';
  const darkBodyB = nitroColor === '#ff2d78' ? 'rgba(30,0,10,0.96)' : 'rgba(0,15,22,0.96)';
  const nitroActive = bNitroTimer > 0 && bNitroColor === nitroColor;
  const nitroFrac = bNitroTimer / NITRO_DURATION;
  const isEnding = nitroActive && nitroFrac < 0.30;
  const blinkOn = isEnding ? (Math.floor(colorTime * 10) % 2 === 0) : true;
  const extraW = pNitroWidth * PW * NITRO_WIDTH_SCALE;
  const pw = PW + extraW;
  const pxOff = px - extraW / 2;
  const velGlow = Math.min(Math.abs(pvel) * 4, 18);
  const nitroGlow = pNitroWidth * 38;
  const outerBlur = 18 + velGlow + nitroGlow;
  const innerBlur = 8 + velGlow * 0.5 + nitroGlow * 0.5;
  const hitAlpha = pHitFlash * 0.45;

  // Hit flash ring
  if (pHitFlash > 0) {
    const expand = (1 - pHitFlash) * 8;
    ctx.save();
    ctx.globalAlpha = pHitFlash * 0.7;
    ctx.shadowColor = nitroColor; ctx.shadowBlur = 20 * pHitFlash;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(pxOff - expand, py - expand, pw + expand*2, PH + expand*2, PH/2 + expand); ctx.stroke();
    ctx.restore();
  }

  // Nitro impact electric shock rings
  if (pNitroImpact > 0) {
    for (let ri = 0; ri < 3; ri++) {
      const phase = 1 - Math.max(0, pNitroImpact - ri * 0.2);
      if (phase <= 0 || phase >= 1) continue;
      const ringExpand = phase * (18 + ri * 10);
      const alpha = (1 - phase) * pNitroImpact * 0.85;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = impactRingColor;
      ctx.shadowColor = impactRingColor;
      ctx.shadowBlur = 22;
      ctx.lineWidth = 2.5 - ri * 0.5;
      ctx.beginPath();
      ctx.roundRect(pxOff - ringExpand, py - ringExpand, pw + ringExpand*2, PH + ringExpand*2, PH/2 + ringExpand);
      ctx.stroke();
      ctx.restore();
    }
  }

  // Lateral motion halo — subtle horizontal-only taper
  const _velAbs = Math.abs(pvel);
  if (_velAbs > 0.6) {
    const trailLen = Math.min(PW * 0.4, _velAbs * 2.5);
    const trailEdgeX = pvel > 0 ? pxOff : pxOff + pw;
    const trailTipX  = trailEdgeX - Math.sign(pvel) * trailLen;
    ctx.save();
    const grad = ctx.createLinearGradient(trailEdgeX, 0, trailTipX, 0);
    grad.addColorStop(0, nitroColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = Math.min(0.18, _velAbs * 0.022);
    ctx.shadowColor = nitroColor; ctx.shadowBlur = 6;
    ctx.fillStyle = grad;
    const x1 = Math.min(trailEdgeX, trailTipX);
    const x2 = Math.max(trailEdgeX, trailTipX);
    const haloH = PH * 0.5;
    ctx.beginPath(); ctx.roundRect(x1, py + PH * 0.25, x2 - x1, haloH, haloH / 2); ctx.fill();
    ctx.restore();
  }

  // Paddle body
  if (blinkOn) {
    if (nitroActive) {
      // Very dark body
      ctx.save();
      ctx.shadowColor = nitroColor; ctx.shadowBlur = innerBlur;
      ctx.fillStyle = isEnding ? darkBodyA : darkBodyB;
      ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.fill();
      ctx.restore();
      // Side neon glow
      const pulse = isEnding
        ? (0.5 + Math.sin(colorTime * 18) * 0.5)
        : (0.6 + Math.sin(colorTime * 6) * 0.4);
      const sideW = PH * 1.4;
      ctx.save();
      ctx.globalAlpha = 0.85 * pulse;
      ctx.shadowColor = nitroColor; ctx.shadowBlur = 24;
      ctx.fillStyle = nitroColor;
      ctx.beginPath(); ctx.roundRect(pxOff, py, sideW, PH, PH/2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(pxOff + pw - sideW, py, sideW, PH, PH/2); ctx.fill();
      ctx.restore();
      // Thin outline glow
      ctx.save();
      ctx.shadowColor = nitroColor; ctx.shadowBlur = outerBlur;
      ctx.strokeStyle = nitroColor; ctx.lineWidth = isEnding ? 2 : 1;
      ctx.globalAlpha = isEnding ? 1.0 : 0.8;
      ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.stroke();
      ctx.restore();
    } else {
      // Normal: outer glow + solid
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.min(Math.abs(pvel) * 0.04, 0.2);
      ctx.shadowColor = nitroColor; ctx.shadowBlur = outerBlur;
      ctx.fillStyle = nitroColor;
      ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.fill();
      ctx.restore();
      ctx.save();
      ctx.shadowColor = nitroColor; ctx.shadowBlur = innerBlur;
      ctx.fillStyle = nitroColor;
      ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.fill();
      ctx.restore();
    }
    // Hit blink overlay
    if (hitAlpha > 0) {
      ctx.save();
      ctx.globalAlpha = hitAlpha;
      ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.fill();
      ctx.restore();
    }
  } else {
    // Blink-off frame during nitro ending
    ctx.save();
    ctx.shadowColor = nitroColor; ctx.shadowBlur = 4;
    ctx.fillStyle = nitroColor === '#ff2d78' ? 'rgba(255,45,120,0.18)' : 'rgba(0,245,255,0.18)';
    ctx.beginPath(); ctx.roundRect(pxOff, py, pw, PH, PH/2); ctx.fill();
    ctx.restore();
  }
}


function drawField(p1y, p2y, fieldMid) {
  // Center line - exact midpoint between the two paddles
  ctx.setLineDash([]);
  ctx.strokeStyle = `hsla(${_hue},${_bgS}%,50%,0.35)`;
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.moveTo(0, fieldMid); ctx.lineTo(W, fieldMid); ctx.stroke();

  // Side walls — subtle neon white line always visible + flash on ball hit + nitro glow
  {
    const wallAlpha = 0.06; // always-on — very faint neon line
    const wallBlur  = 3;
    const wallNitroActive = bNitroTimer > 0 && bNitroColor !== null;
    const wallNitroColor = wallNitroActive ? bNitroColor : '#ffffff';
    const isCyanNitro = bNitroColor === '#00f5ff';
    // flow direction: cyan→up (toward P2, y decreasing), magenta→down (toward P1, y increasing)
    const flowDir = isCyanNitro ? -1 : 1;

    // Left wall
    const lFlash = wallFlashLeft;
    ctx.save();
    ctx.shadowColor = wallNitroActive ? wallNitroColor : '#ffffff';
    ctx.shadowBlur  = wallBlur + lFlash * 14 + (wallNitroActive ? 10 : 0);
    ctx.strokeStyle = wallNitroActive
      ? wallNitroColor
      : `rgba(255,255,255,${wallAlpha + lFlash * 0.30})`;
    ctx.lineWidth   = 1;
    ctx.globalAlpha = wallNitroActive ? 0.55 : 1;
    ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(1, H); ctx.stroke();
    ctx.globalAlpha = 1;
    if (lFlash > 0) {
      ctx.globalAlpha = lFlash * 0.09;
      ctx.fillStyle = wallNitroActive ? wallNitroColor : '#ffffff';
      ctx.fillRect(0, 0, 5, H);
      ctx.globalAlpha = 1;
    }
    // Nitro flow dashes along left wall
    if (wallNitroActive) {
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = wallNitroColor;
      ctx.shadowColor = wallNitroColor;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      const segLen = H / 5;
      for (let i = 0; i < 5; i++) {
        const phase = ((wallNitroFlowOffset + colorTime * 0.008 + i / 5) % 1 + 1) % 1;
        const yPos = (phase * H * flowDir + H * 2) % H;
        const dashLen = segLen * 0.35;
        ctx.beginPath();
        ctx.moveTo(1, yPos);
        ctx.lineTo(1, yPos + dashLen * flowDir);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // Right wall
    const rFlash = wallFlashRight;
    ctx.save();
    ctx.shadowColor = wallNitroActive ? wallNitroColor : '#ffffff';
    ctx.shadowBlur  = wallBlur + rFlash * 14 + (wallNitroActive ? 10 : 0);
    ctx.strokeStyle = wallNitroActive
      ? wallNitroColor
      : `rgba(255,255,255,${wallAlpha + rFlash * 0.30})`;
    ctx.lineWidth   = 1;
    ctx.globalAlpha = wallNitroActive ? 0.55 : 1;
    ctx.beginPath(); ctx.moveTo(W - 1, 0); ctx.lineTo(W - 1, H); ctx.stroke();
    ctx.globalAlpha = 1;
    if (rFlash > 0) {
      ctx.globalAlpha = rFlash * 0.09;
      ctx.fillStyle = wallNitroActive ? wallNitroColor : '#ffffff';
      ctx.fillRect(W - 5, 0, 5, H);
      ctx.globalAlpha = 1;
    }
    // Nitro flow dashes along right wall
    if (wallNitroActive) {
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = wallNitroColor;
      ctx.shadowColor = wallNitroColor;
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      const segLen = H / 5;
      for (let i = 0; i < 5; i++) {
        const phase = ((wallNitroFlowOffset + colorTime * 0.008 + i / 5) % 1 + 1) % 1;
        const yPos = (phase * H * flowDir + H * 2) % H;
        const dashLen = segLen * 0.35;
        ctx.beginPath();
        ctx.moveTo(W - 1, yPos);
        ctx.lineTo(W - 1, yPos + dashLen * flowDir);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function drawHUD(p1y, p2y, fieldMid) {
  // Scores - positioned relative to field thirds
  const fieldTop = p2y + PH;
  const fieldBot = p1y;
  ctx.font = `bold ${Math.round(H*0.12)}px Orbitron,monospace`; ctx.textAlign='center';
  ctx.fillStyle = 'rgba(0,245,255,0.1)';  ctx.fillText(s1, W*0.5, fieldMid + (fieldBot - fieldMid) * 0.55);
  ctx.fillStyle = mode===2?'rgba(255,45,120,0.1)':'rgba(255,255,255,0.06)';
  ctx.fillText(s2, W*0.5, fieldMid - (fieldMid - fieldTop) * 0.35);

  // Survival HUD
  if (survivalMode) {
    const sec = Math.floor(survivalTimer / 60);
    const spx = Math.round((survivalSpeed - 1) * 100);
    ctx.save();
    ctx.font = `bold ${Math.round(W*0.04)}px Orbitron,monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb400'; ctx.shadowColor = '#ffb400'; ctx.shadowBlur = 10;
    ctx.fillText(`⚡ ${sec}s  +${spx}%`, W/2, fieldMid);
    ctx.shadowBlur = 0; ctx.restore();
  }

  // Adaptive diff indicator (subtle, top-right, 1P only)
  if (mode === 1 && !survivalMode) {
    ctx.save();
    ctx.font = `${Math.round(W*0.025)}px Share Tech Mono,monospace`;
    ctx.textAlign = 'right'; ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#00f5ff';
    ctx.fillText(`IA ${adaptiveDiff.toFixed(1)}`, W - 10, fieldMid);
    ctx.globalAlpha = 1; ctx.restore();
  }
}

function drawEffects(p1y, p2y) {
  // Goal screen flash
  if (goalFlashTimer > 0) {
    goalFlashTimer--;
    ctx.save();
    ctx.globalAlpha = goalFlashTimer / 8 * 0.55;
    ctx.fillStyle = goalFlashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // "GOAL!" flash
  if (state === 'goal' && goalTimer > 60) {
    const alpha = Math.min(1, (goalTimer-60)/30) * Math.abs(Math.sin(goalTimer*0.25));
    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.font = `bold ${Math.round(W*0.14)}px Orbitron,monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = goalScorer===1?'#00f5ff':'#ff2d78';
    ctx.shadowColor = goalScorer===1?'#00f5ff':'#ff2d78'; ctx.shadowBlur=30;
    ctx.fillText('GOL!', W/2, H/2 + Math.round(W*0.07));
    ctx.restore();
  }

  // Particles
  particles.forEach(p => {
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    if (p.shape==='rect') ctx.fillRect(p.x-p.r,p.y-p.r/2,p.r*2,p.r);
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });

  drawNitroWarning();

  // Boost orbs - stacked neon chevrons
  boostZones.forEach(z => {
    ctx.save();
    const onCooldown = z.cooldown > 0;
    const zOpacity = z.opacity !== undefined ? z.opacity : 1;
    ctx.globalAlpha = zOpacity;
    const pulse = onCooldown ? 0.2 : (0.55 + 0.45 * Math.sin(z.pulse));
    const s = z.r * 0.55; // smaller overall
    // cyan (team1) points UP >>> toward opponent; pink (team2) points DOWN <<< toward player
    const dir = z.team === 1 ? 1 : -1; // cyan tip up, pink tip down
    const hw = s * 0.72;  // wider chevron
    const hh = s * 0.52;
    const gap = s * 0.62;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // two vertical neon lines on sides
    const lineH = s * 2.2;
    const lineAlpha = onCooldown ? 0.06 : 0.18 * pulse;
    ctx.globalAlpha = lineAlpha;
    ctx.strokeStyle = z.color;
    ctx.lineWidth = 1;
    ctx.shadowColor = z.color; ctx.shadowBlur = 6;
    const lx1 = z.x - hw - s*0.18;
    const lx2 = z.x + hw + s*0.18;
    ctx.beginPath(); ctx.moveTo(lx1, z.y - lineH/2); ctx.lineTo(lx1, z.y + lineH/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx2, z.y - lineH/2); ctx.lineTo(lx2, z.y + lineH/2); ctx.stroke();

    // 3 chevrons stacked - leading one in direction of travel
    for (let i = 0; i < 3; i++) {
      // cyan(team1) points UP: leading chevron at top → offset goes negative (up)
      // pink(team2) points DOWN: leading chevron at bottom → offset goes positive (down)
      const leading = z.team === 1 ? -1 : 1;
      const offset = i * gap * leading; // 0=base, 1=mid, 2=front(leading)
      const alpha = onCooldown ? 0.1 : pulse * (0.3 + i * 0.28); // front most bright
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = onCooldown ? 2 : (4 + i*5) * pulse;
      ctx.strokeStyle = z.color;
      ctx.lineWidth = onCooldown ? 0.8 : (0.8 + i*0.45);
      const cy2 = z.y + offset;
      // tip direction: up=-1 for cyan, down=+1 for pink
      const tip = z.team === 1 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(z.x - hw, cy2 - tip * hh); // left base
      ctx.lineTo(z.x,      cy2 + tip * hh); // center tip
      ctx.lineTo(z.x + hw, cy2 - tip * hh); // right base
      ctx.stroke();
    }
    ctx.restore();
  });

  // Dying blocks - blink out
  dyingBlocks = dyingBlocks.filter(d => {
    if (d.flash > 0) {
      // white flash first
      d.flash--;
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
      ctx.globalAlpha = d.flash / 8;
      ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 4); ctx.fill();
      ctx.restore();
      return true;
    }
    d.blink -= 0.045;
    if (d.blink <= 0) return false;
    ctx.save();
    const show = Math.sin(Date.now() * 0.03) > 0;
    if (show) {
      ctx.globalAlpha = d.blink * 0.45;
      ctx.strokeStyle = d.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 4); ctx.stroke();
    }
    ctx.restore();
    return true;
  });

  // Obstacles
  obstacles.forEach(o => {
    ctx.save();
    const g = o.ghost || 0;
    if (g > 0) {
      // blink while ghost (rapid on/off)
      const blink = Math.sin(Date.now() * 0.02) > 0;
      if (blink) {
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = o.color;
        ctx.lineWidth = 2;
        ctx.shadowColor = o.color; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.stroke();
      }
    } else {
      if (o.moving) {
        // metallic violet - layered look
        ctx.shadowColor = o.flash > 0 ? '#fff' : '#7c3aed';
        ctx.shadowBlur = o.flash > 0 ? 24 : 18;
        // dark base
        ctx.fillStyle = o.flash > 0 ? '#fff' : (o.colorSh || '#2e1065');
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.fill();
        if (!o.flash) {
          // main gradient - metallic
          const mg = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
          mg.addColorStop(0, '#c4b5fd');
          mg.addColorStop(0.2, '#a78bfa');
          mg.addColorStop(0.5, '#7c3aed');
          mg.addColorStop(0.8, '#4c1d95');
          mg.addColorStop(1, '#2e1065');
          ctx.fillStyle = mg;
          ctx.beginPath(); ctx.roundRect(o.x+1, o.y+1, o.w-2, o.h-2, 3); ctx.fill();
          // specular highlight top edge
          const sg = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
          sg.addColorStop(0, 'rgba(255,255,255,0)');
          sg.addColorStop(0.3, 'rgba(255,255,255,0.35)');
          sg.addColorStop(0.7, 'rgba(255,255,255,0.35)');
          sg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = sg;
          ctx.beginPath(); ctx.roundRect(o.x+2, o.y+1, o.w-4, o.h*0.35, 2); ctx.fill();
          // outline glow
          ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1;
          ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.fillStyle = o.flash > 0 ? '#fff' : o.color;
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.fill();
      }
    }
    ctx.restore();
  });
}

function drawPaddles(p1y, p2y) {
  drawPaddle(p2x, p2y, p2vel, p2NitroWidth, p2HitFlash, p2NitroImpact, '#ff2d78');
  drawPaddle(p1x, p1y, p1vel, p1NitroWidth, p1HitFlash, p1NitroImpact, '#00f5ff');
}

function drawBall(p1y, p2y) {
  // Ball (hidden during goal celebration start)
  if (state !== 'goal' || goalTimer < 90) {
    ctx.save();
    // Motion blur trail when ball is fast
    if (state === 'playing') {
      const spd = Math.sqrt(bvx*bvx+bvy*bvy);
      const normalSpd = H * 0.008;
      if (spd > normalSpd * 1.4) {
        const blurSteps = 3;
        for (let bi = 1; bi <= blurSteps; bi++) {
          const bx2 = bx - bvx * bi * 0.4;
          const by2 = by - bvy * bi * 0.4;
          ctx.save();
          ctx.globalAlpha = 0.12 / bi;
          ctx.fillStyle = bNitroColor || '#00ff88';
          ctx.beginPath(); ctx.arc(bx2, by2, BR * (1 - bi*0.15), 0, Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }
    }

    // Nitro trail - neon streak following curve
    if (bNitroTimer > 0 && bNitroColor && state === 'playing') {
      nitroTrail.push({x:bx, y:by, life:1.0, color:bNitroColor, r:BR*0.42});
      if (nitroTrail.length > 18) nitroTrail.shift();
    }
    // draw trail as connected fading line + dots
    if (nitroTrail.length > 1) {
      ctx.save();
      for (let ti = 0; ti < nitroTrail.length; ti++) {
        const t = nitroTrail[ti];
        const fade = (ti+1) / nitroTrail.length;
        ctx.globalAlpha = fade * 0.65;
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r * fade, 0, Math.PI*2);
        ctx.fill();
      }
      // bright connecting line along trail
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = bNitroColor || '#fff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      nitroTrail.forEach((t,i) => i===0 ? ctx.moveTo(t.x,t.y) : ctx.lineTo(t.x,t.y));
      ctx.stroke();
      ctx.restore();
    }
    // decay trail
    nitroTrail.forEach(t => t.life -= 0.04);
    if (bNitroTimer <= 0) nitroTrail = [];
    if (bNitroTimer > 0) ballTrail = []; // clear normal trail during nitro

    const nitroFracBall = bNitroTimer / NITRO_DURATION;
    const isEnding = bNitroTimer > 0 && nitroFracBall < 0.25;
    const blinkOn = (Date.now() / 280) % 1 < 0.5;
    const ballR = (bNitroTimer > 0 && bNitroColor) ? BR * 0.68 : BR;

    ctx.save();
    if (bNitroTimer > 0 && bNitroColor) {
      if (isEnding && !blinkOn) {
        // invisible during blink off - draw nothing
      } else {
        const nc = bNitroColor;
        ctx.globalAlpha = 0.15; ctx.fillStyle = nc;
        ctx.beginPath(); ctx.arc(bx, by, ballR*1.7, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowColor = nc; ctx.shadowBlur = 20;
        const g = ctx.createRadialGradient(bx-ballR*0.25, by-ballR*0.3, ballR*0.05, bx, by, ballR);
        g.addColorStop(0,'#fff'); g.addColorStop(0.35,nc); g.addColorStop(0.8,nc);
        g.addColorStop(1, nc==='#00f5ff'?'#003366':'#550022');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8; ctx.stroke();
      }
    } else {
      // Normal ball — motion trail + compact neon core
      const bc = cfg.ballColor || '#c8a8f0';
      const _spd = Math.sqrt(bvx*bvx + bvy*bvy);
      const _minSpd = H * 0.003;
      const _maxSpd = H * 0.016;
      const _spdFrac = Math.min(1, Math.max(0, (_spd - _minSpd) / (_maxSpd - _minSpd)));

      // Core with white center — no halo
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      const gn = ctx.createRadialGradient(bx - ballR*0.28, by - ballR*0.32, ballR*0.04, bx, by, ballR);
      gn.addColorStop(0, '#ffffff');
      gn.addColorStop(0.20, bc);
      gn.addColorStop(1, bc);
      ctx.fillStyle = gn;
      ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 0.7; ctx.stroke();
    }
    ctx.restore();
  }

  // Ball waiting indicator (idle state)
  if (state === 'idle') {
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(Date.now()*0.005);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
    const who = (goalScorer===0||goalScorer===2)?1:2;
    const indicatorY = who===1 ? H-PH-Math.round(H*0.04)-BR*3 : Math.round(H*0.04)+PH+BR*3;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx,indicatorY); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();

  // Labels
}
}

function draw() {
  const p1y = H - PH - Math.round(H*0.10);
  const p2y = Math.round(H*0.04);
  const fieldMid = (p2y + PH + p1y) / 2;

  // (screen shake disabled — flash effect used instead)

  // === BACKGROUND ===
  colorTime += 0.004;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, p1y + PH + Math.round(H*0.10));
  ctx.clip();
  drawBackground(bgStyle, fieldMid, p2y + PH, p1y);
  ctx.restore();
  ctx.fillStyle = '#06060e';
  ctx.fillRect(0, p1y + PH + Math.round(H*0.10), W, H);

  drawField(p1y, p2y, fieldMid);
  drawHUD(p1y, p2y, fieldMid);
  drawEffects(p1y, p2y);
  drawPaddles(p1y, p2y);
  drawBall(p1y, p2y);

  // Nitro hit full-screen flash (on top of everything)
  if (nitroHitFlash > 0) {
    ctx.save();
    ctx.globalAlpha = nitroHitFlash * 0.38;
    ctx.fillStyle = nitroHitColor;
    ctx.fillRect(0, 0, W, H);
    // bright vignette ring at edges
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, nitroHitColor);
    ctx.globalAlpha = nitroHitFlash * 0.55;
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    nitroHitFlash *= 0.80;
    if (nitroHitFlash < 0.01) nitroHitFlash = 0;
  }

}

// ── TOUCH ──
gc.addEventListener('touchstart', e=>{
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(err) {}
  ensureNitroLoaded();
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const ty = (t.clientY - gc.getBoundingClientRect().top) * (H/gc.getBoundingClientRect().height);
    if (ty > H/2) { t1id=t.identifier; t1x=t.clientX; }
    else if (mode===2) { t2id=t.identifier; t2x=t.clientX; }
  });
},{passive:false});

gc.addEventListener('touchmove', e=>{
  e.preventDefault();
  const rect = gc.getBoundingClientRect();
  const scaleX = W/rect.width;
  Array.from(e.changedTouches).forEach(t=>{
    const tx = (t.clientX-rect.left)*scaleX;
    const ty = (t.clientY-rect.top)*(H/rect.height);
    if (ty > H/2 || t.identifier===t1id) {
      p1x = Math.max(0, Math.min(W-PW, tx-PW/2));
    } else if (mode===2 || t.identifier===t2id) {
      p2x = Math.max(0, Math.min(W-PW, tx-PW/2));
    }
  });
},{passive:false});

gc.addEventListener('touchend', e=>{ e.preventDefault(); },{passive:false});

// Mouse — move P1 paddle (bottom) horizontally
gc.addEventListener('mousemove', e => {
  if (!running) return;
  const rect = gc.getBoundingClientRect();
  const tx = (e.clientX - rect.left) * (W / rect.width);
  p1x = Math.max(0, Math.min(W - PW, tx - PW / 2));
});

document.addEventListener('mousedown', () => {
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
});

document.addEventListener('keydown', e=>{
  const s = W*0.04;
  if(e.key==='ArrowLeft')  p1x=Math.max(0,p1x-s);
  if(e.key==='ArrowRight') p1x=Math.min(W-PW,p1x+s);
  if(e.key==='a') p2x=Math.max(0,p2x-s);
  if(e.key==='d') p2x=Math.min(W-PW,p2x+s);
});

function drawBallOnCanvas(canvas, color, selected) {
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 2;
  const css = 44;
  canvas.width = css * dpr;
  canvas.height = css * dpr;
  canvas.style.width = css + 'px';
  canvas.style.height = css + 'px';
  const ctx2 = canvas.getContext('2d');
  ctx2.scale(dpr, dpr);
  ctx2.clearRect(0, 0, css, css);
  const cx = css / 2, cy = css / 2;
  const r = css * 0.34;

  // nitro-style gradient ball
  ctx2.globalAlpha = 0.07; ctx2.fillStyle = color;
  ctx2.beginPath(); ctx2.arc(cx, cy, r*1.35, 0, Math.PI*2); ctx2.fill();
  ctx2.globalAlpha = 1;
  ctx2.shadowColor = color; ctx2.shadowBlur = selected ? 22 : 14;
  const g = ctx2.createRadialGradient(cx-r*0.25, cy-r*0.3, r*0.05, cx, cy, r);
  g.addColorStop(0,'#fff'); g.addColorStop(0.35,color); g.addColorStop(0.8,color);
  g.addColorStop(1,'rgba(0,0,20,0.85)');
  ctx2.fillStyle = g;
  ctx2.beginPath(); ctx2.arc(cx, cy, r, 0, Math.PI*2); ctx2.fill();
  ctx2.strokeStyle='rgba(255,255,255,0.5)'; ctx2.lineWidth=0.8; ctx2.stroke();
  ctx2.shadowBlur = 0;

  // selection: white inner ring
  if (selected) {
    ctx2.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx2.lineWidth = 1.5;
    ctx2.beginPath(); ctx2.arc(cx, cy, r - 2, 0, Math.PI*2); ctx2.stroke();
  }
}

let soundOn = true;
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}


// ── STARS ──
function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * 2 - 1, // -1 to 1 normalized
      y: Math.random() * 2 - 1,
      z: Math.random(),
      speed: 0.0003 + Math.random() * 0.0004
    });
  }
}

function drawStars() {
  stars.forEach(s => {
    // Move toward viewer (z decreases)
    s.z -= s.speed * (bNitroTimer > 0 ? 3 : 1);
    if (s.z <= 0) { s.z = 1; s.x = Math.random()*2-1; s.y = Math.random()*2-1; }
    // Project to screen
    const px = (s.x / s.z) * W/2 + W/2;
    const py = (s.y / s.z) * H/2 + H/2;
    if (px < 0 || px > W || py < 0 || py > H) { s.z = 1; s.x = Math.random()*2-1; s.y = Math.random()*2-1; return; }
    const size = (1 - s.z) * 2.5;
    const alpha = (1 - s.z) * 0.8;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = bNitroTimer > 0 ? (bNitroColor || '#fff') : '#fff';
    ctx.shadowColor = bNitroTimer > 0 ? (bNitroColor || '#fff') : 'rgba(200,200,255,0.5)';
    ctx.shadowBlur = bNitroTimer > 0 ? 6 : 2;
    ctx.beginPath(); ctx.arc(px, py, Math.max(0.3, size), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ── FLOATING SCORE NUMBERS ──
function addFloatingNum(x, y, text, color) {
  floatingNums.push({ x, y, text, color, life: 1.0, vy: -1.5 });
}

function drawFloatingNums() {
  floatingNums = floatingNums.filter(n => {
    n.y += n.vy; n.life -= 0.025;
    if (n.life <= 0) return false;
    ctx.save();
    ctx.globalAlpha = n.life;
    ctx.font = `bold ${Math.round(W*0.06)}px Orbitron,monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = n.color;
    ctx.shadowColor = n.color; ctx.shadowBlur = 12;
    ctx.fillText(n.text, n.x, n.y);
    ctx.restore();
    return true;
  });
}

// ── BGM ──
let bgmPlaying = false, bgmNoteIdx = 0, bgmTimeoutId = null;

function playTone(freq, type, dur, vol, delay=0) {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.value = freq;
    const t = ac.currentTime + delay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch(e) {}
}

function sndHit()  { playTone(320, 'square', 0.06, 0.35); }

function sndNitroHit() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    // 1. Sub-bass shockwave (felt more than heard)
    const sub = ac.createOscillator(); const subG = ac.createGain();
    sub.connect(subG); subG.connect(ac.destination);
    sub.type = 'sine';
    sub.frequency.setValueAtTime(55, t);
    sub.frequency.exponentialRampToValueAtTime(18, t + 0.28);
    subG.gain.setValueAtTime(1.1, t);
    subG.gain.exponentialRampToValueAtTime(0.001, t + 0.30);
    sub.start(t); sub.stop(t + 0.32);
    // 2. Heavy mid thud — paddle body impact
    const thud = ac.createOscillator(); const thudG = ac.createGain();
    thud.connect(thudG); thudG.connect(ac.destination);
    thud.type = 'triangle';
    thud.frequency.setValueAtTime(140, t);
    thud.frequency.exponentialRampToValueAtTime(35, t + 0.14);
    thudG.gain.setValueAtTime(0.85, t);
    thudG.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    thud.start(t); thud.stop(t + 0.18);
    // 3. Shattering noise burst with exponential envelope (like breaking material)
    const bufLen = Math.floor(ac.sampleRate * 0.22);
    const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.06));
    }
    const crack = ac.createBufferSource(); const crackG = ac.createGain();
    crack.buffer = buf; crack.connect(crackG); crackG.connect(ac.destination);
    crackG.gain.setValueAtTime(0.9, t + 0.005);
    crackG.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
    crack.start(t + 0.005);
    // 4. Electric screech 900→120Hz — energy discharge
    const zap = ac.createOscillator(); const zapG = ac.createGain();
    zap.connect(zapG); zapG.connect(ac.destination);
    zap.type = 'sawtooth';
    zap.frequency.setValueAtTime(900, t + 0.01);
    zap.frequency.exponentialRampToValueAtTime(120, t + 0.26);
    zapG.gain.setValueAtTime(0.40, t + 0.01);
    zapG.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    zap.start(t + 0.01); zap.stop(t + 0.29);
    // 5. Metallic high crack — fracture sound
    const ping = ac.createOscillator(); const pingG = ac.createGain();
    ping.connect(pingG); pingG.connect(ac.destination);
    ping.type = 'square';
    ping.frequency.setValueAtTime(1400, t + 0.008);
    ping.frequency.exponentialRampToValueAtTime(380, t + 0.13);
    pingG.gain.setValueAtTime(0.28, t + 0.008);
    pingG.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    ping.start(t + 0.008); ping.stop(t + 0.16);
  } catch(e) {}
}

function sndNitroExplosion(color) {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    const isCyan = color === '#00f5ff';

    // 1. Initial BOOM - low thud
    const boom = ac.createOscillator(); const boomG = ac.createGain();
    boom.connect(boomG); boomG.connect(ac.destination);
    boom.type = 'sine';
    boom.frequency.setValueAtTime(80, t);
    boom.frequency.exponentialRampToValueAtTime(30, t + 0.3);
    boomG.gain.setValueAtTime(0.5, t);
    boomG.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    boom.start(t); boom.stop(t + 0.35);

    // 2. Power sweep - rising frequency
    const sweep = ac.createOscillator(); const sweepG = ac.createGain();
    sweep.connect(sweepG); sweepG.connect(ac.destination);
    sweep.type = 'sawtooth';
    sweep.frequency.setValueAtTime(isCyan ? 150 : 200, t + 0.05);
    sweep.frequency.exponentialRampToValueAtTime(isCyan ? 1200 : 900, t + 0.55);
    sweepG.gain.setValueAtTime(0.001, t + 0.05);
    sweepG.gain.linearRampToValueAtTime(0.25, t + 0.15);
    sweepG.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    sweep.start(t + 0.05); sweep.stop(t + 0.65);

    // 3. High sparkle at peak
    const spark = ac.createOscillator(); const sparkG = ac.createGain();
    spark.connect(sparkG); sparkG.connect(ac.destination);
    spark.type = 'square';
    spark.frequency.setValueAtTime(isCyan ? 1800 : 1400, t + 0.4);
    spark.frequency.exponentialRampToValueAtTime(isCyan ? 2400 : 2000, t + 0.7);
    sparkG.gain.setValueAtTime(0.12, t + 0.4);
    sparkG.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
    spark.start(t + 0.4); spark.stop(t + 0.8);

  } catch(e) {}
}
function sndWall() { playTone(200, 'square', 0.06, 0.28); }
function sndGoal() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    // victory fanfare - ascending chord stab
    [[523,0],[659,0.05],[784,0.1],[1047,0.18]].forEach(([f,d]) => {
      const o = ac.createOscillator(); const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, t+d);
      g.gain.exponentialRampToValueAtTime(0.001, t+d+0.35);
      o.start(t+d); o.stop(t+d+0.4);
    });
    // crowd noise simulation - filtered noise burst
    const buf = ac.createBuffer(1, ac.sampleRate*0.6, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0; i<data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=800; filt.Q.value=0.5;
    const gn = ac.createGain(); gn.gain.value = 0.12;
    src.connect(filt); filt.connect(gn); gn.connect(ac.destination);
    src.start(t+0.1); src.stop(t+0.7);
    // triumphant high note
    playTone(1568, 'sine', 0.15, 0.22, 0.45);
    playTone(1047, 'sine', 0.12, 0.3, 0.55);
  } catch(e) {}
}

function sndLose() {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const t = ac.currentTime;
    // descending "wah wah" trombone feel
    [[400,0],[320,0.15],[260,0.3],[200,0.45]].forEach(([f,d]) => {
      const o = ac.createOscillator(); const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sawtooth'; o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t+d);
      g.gain.exponentialRampToValueAtTime(0.001, t+d+0.2);
      o.start(t+d); o.stop(t+d+0.25);
    });
  } catch(e) {}
}

let nitroPlaying = false, nitroIntervalId = null;

let nitroBuffer = null, nitroSource = null, nitroGainNode = null, audioReady = false;

function loadNitroAudio(andPlay) {
  if (nitroBuffer) { if (andPlay) _playNitroNow(); return; }
  try {
    const ac = getAudio();
    if (ac.state === 'suspended') ac.resume();
    const bin = atob(NITRO_AUDIO_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer.slice(0), buf => {
      nitroBuffer = buf;
      audioReady = true;
      if (andPlay) _playNitroNow();
    }, () => {});
  } catch(e) {}
}

function _playNitroNow() {
  if (!soundOn || !nitroBuffer) return;
  const ac = getAudio();
  const doPlay = () => {
    try {
      if (nitroSource) { try { nitroSource.stop(); } catch(e){} nitroSource = null; }
      if (nitroGainNode) { try { nitroGainNode.disconnect(); } catch(e){} }
      nitroGainNode = ac.createGain();
      nitroGainNode.gain.value = 1.4;
      nitroGainNode.connect(ac.destination);
      nitroSource = ac.createBufferSource();
      nitroSource.buffer = nitroBuffer;
      nitroSource.connect(nitroGainNode);
      nitroSource.start(0);
      nitroSource.onended = () => { nitroSource = null; };
    } catch(e) {}
  };
  if (ac.state === 'suspended') ac.resume().then(doPlay);
  else doPlay();
}

function startNitroSound() {
  nitroPlaying = true;
  if (!soundOn) return;
  if (!nitroBuffer) { loadNitroAudio(true); return; }
  _playNitroNow();
}

function stopNitroSound() {
  if (!nitroPlaying) return;
  nitroPlaying = false;
  if (nitroGainNode) {
    try {
      const ac = getAudio();
      nitroGainNode.gain.cancelScheduledValues(ac.currentTime);
      nitroGainNode.gain.setValueAtTime(0, ac.currentTime);
    } catch(e) {}
  }
  if (nitroSource) {
    try { nitroSource.stop(); } catch(e) {}
    nitroSource = null;
  }
}

function updateNitroSound() {
  if (bNitroTimer > 0 && bNitroColor) {
    if (!nitroPlaying) startNitroSound();
  } else {
    if (nitroPlaying) stopNitroSound();
  }
}

// Load nitro audio on first user gesture
function ensureNitroLoaded() { if (!nitroBuffer) loadNitroAudio(); }

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  const audio = document.getElementById('nitroAudio');

  // Keep pause screen in sync
  const psb = document.getElementById('pauseSoundBtn');
  if (psb) psb.textContent = soundOn ? '🔊 Sonido: ON' : '🔇 Sonido: OFF';
}
