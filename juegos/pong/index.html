<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06060e;--border:#1a1a35;--cyan:#00f5ff;--pink:#ff2d78;--gold:#ffc740;--text:#e8e8ff;--dim:#3a3a6a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Share Tech Mono',monospace;color:var(--text);display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
  .btn-back{position:fixed;top:14px;left:14px;z-index:500;display:inline-flex;align-items:center;gap:7px;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:0.2em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:8px 14px;border-radius:8px;background:rgba(6,6,14,0.85);border:1px solid var(--border);backdrop-filter:blur(8px);}
  .wrap{position:relative;flex:1;width:100%;max-width:440px;margin-top:52px;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(6,6,14,0.92);backdrop-filter:blur(4px);z-index:10;}
  .overlay.hidden{display:none;}
  .ov-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(24px,6vw,32px);letter-spacing:0.15em;text-align:center;}
  .ov-sub{font-size:11px;color:var(--dim);letter-spacing:0.15em;text-align:center;line-height:2;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.2em;padding:11px 22px;border-radius:8px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;-webkit-tap-highlight-color:transparent;border:1px solid var(--cyan);background:rgba(0,245,255,0.1);color:var(--cyan);}
  .btn:active{background:rgba(0,245,255,0.22);}
  .btn.p2{border-color:var(--pink);background:rgba(255,45,120,0.1);color:var(--pink);}
  .cfg-row{display:flex;flex-direction:column;gap:6px;width:100%;}
  .cfg-label{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;}
  .cfg-val{color:var(--cyan);margin-left:8px;}
  .cfg-track{display:flex;flex-direction:column;gap:3px;}
  .cfg-track input[type=range]{width:100%;accent-color:var(--cyan);height:4px;cursor:pointer;}
  .cfg-ticks{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);letter-spacing:0.1em;padding:0 2px;}
</style>
</head>
<body>
<a class="btn-back" href="../../index.html"><span style="font-size:13px">←</span> Inicio</a>
<div style="position:fixed;top:14px;right:14px;z-index:500;display:flex;gap:8px;">
  <button id="soundBtn" onclick="toggleSound()" style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--dim);background:rgba(6,6,14,0.85);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;backdrop-filter:blur(8px);">🔊</button>
  <button id="pauseBtn" onclick="togglePause()" style="font-family:'Orbitron',sans-serif;font-size:11px;color:var(--dim);background:rgba(6,6,14,0.85);border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;backdrop-filter:blur(8px);">⏸</button>
</div>

<div class="wrap" id="wrap">
  <canvas id="gc"></canvas>
  <div class="overlay" id="ovMenu" style="overflow-y:auto;padding:24px 20px;gap:0">
    <div class="ov-title" style="color:var(--cyan);filter:drop-shadow(0 0 20px var(--cyan));margin-bottom:20px">PONG</div>

    <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:14px;margin-bottom:22px">

      <div class="cfg-row">
        <div class="cfg-label">Dificultad IA <span class="cfg-val" id="lDiff">3</span></div>
        <div class="cfg-track">
          <input type="range" min="1" max="5" value="3" id="sDiff" oninput="setCfg('difficulty',+this.value,'lDiff',['Muy fácil','Fácil','Normal','Difícil','Brutal'])">
          <div class="cfg-ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        </div>
      </div>

      <div class="cfg-row">
        <div class="cfg-label">Bloques estáticos <span class="cfg-val" id="lBlocks">0</span></div>
        <div class="cfg-track">
          <input type="range" min="0" max="4" value="0" id="sBlocks" oninput="setCfg('maxBlocks',+this.value,'lBlocks')">
          <div class="cfg-ticks"><span>0</span><span>2</span><span>4</span><span>6</span></div>
        </div>
      </div>

      <div class="cfg-row">
        <div class="cfg-label">Nitros <span class="cfg-val" id="lNitro">2</span></div>
        <div class="cfg-track">
          <input type="range" min="0" max="6" value="2" id="sNitro" oninput="setCfg('nitroCount',+this.value,'lNitro')">
          <div class="cfg-ticks"><span>0</span><span>2</span><span>4</span><span>6</span></div>
        </div>
      </div>

      <div class="cfg-row" style="align-items:center;flex-direction:row;justify-content:space-between">
        <div class="cfg-label" style="margin-bottom:0">Bloque dinámico</div>
        <button id="btnDyn" onclick="toggleDyn()" class="btn" style="padding:6px 16px;font-size:10px">✓ Sí</button>
      </div>

      <div class="cfg-row" id="dynAtRow">
        <div class="cfg-label">Aparece al golpe <span class="cfg-val" id="lDynAt">30</span></div>
        <div class="cfg-track">
          <input type="range" min="10" max="50" step="10" value="30" id="sDynAt" oninput="setCfg('dynamicAt',+this.value,'lDynAt')">
          <div class="cfg-ticks"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span></div>
        </div>
      </div>

    </div>

    <div class="ov-sub" style="margin-bottom:16px">Deslizá el dedo para mover tu paleta</div>
    <div class="btn-row">
      <button class="btn" onclick="startGame(1)">▶ 1 Jugador</button>
      <button class="btn p2" onclick="startGame(2)">▶▶ 2 Jugadores</button>
    </div>
  </div>
  <div class="overlay hidden" id="ovPause">
    <div class="ov-title" style="color:var(--cyan);filter:drop-shadow(0 0 20px var(--cyan))">PAUSA</div>
    <div class="ov-sub" id="pauseScore"></div>
    <div class="btn-row">
      <button class="btn" onclick="resumeGame()">▶ Continuar</button>
      <button class="btn" onclick="showMenu()">⌂ Menú</button>
    </div>
  </div>
  <div class="overlay hidden" id="ovEnd">
    <div class="ov-title" id="endTitle"></div>
    <div class="ov-sub" id="endSub"></div>
    <div class="btn-row">
      <button class="btn" onclick="startGame(lastMode)">↺ Revancha</button>
      <button class="btn" onclick="showMenu()">⌂ Menú</button>
    </div>
  </div>
</div>

<script>
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');
const wrap = document.getElementById('wrap');

const WIN = 7;
let W, H, PW, PH, BR;
let mode = 1, lastMode = 1;
let running = false, animId = null;

// Game state
let p1x, p2x, s1, s2;
let bx, by, bvx, bvy, bspin=0, bNitroTimer=0, bNitroColor=null, preNitroSpd=0;
const NITRO_DURATION = 780; // 13s

// ── CONFIG ──
let cfg = {
  difficulty: 3,    // 1-5
  maxBlocks: 0,     // 0-4 static blocks
  nitroCount: 2,    // 0-3 nitro orbs
  dynamicBlock: true,
  dynamicAt: 30
};
let dyingBlocks = [], nitroTrail = [];
let state = 'idle'; // idle | playing | goal | ended
let rally = 0; // hit counter
let obstacles = []; // {x,y,w,h}
let boostZones = []; // {y1,y2, factor}
const RALLY_THRESHOLD = 10;
let goalTimer = 0;
let goalScorer = 0; // 1 or 2
let particles = [];
let p1vel = 0, p2vel = 0; // paddle velocity for angle control
let prevP1x, prevP2x;

// Touch tracking
let t1id = null, t1x = 0; // player1 touch
let t2id = null, t2x = 0; // player2 touch (2P mode)

function resize() {
  W = Math.min(window.innerWidth, 440);
  H = window.innerHeight - 52;
  gc.width = W; gc.height = H;
  wrap.style.height = H + 'px';
  PW = Math.round(W * 0.26);
  PH = Math.round(H * 0.018);
  BR = Math.round(W * 0.026);
}

function startGame(m) {
  mode = m; lastMode = m;
  resize();
  s1 = 0; s2 = 0;
  p1x = W/2 - PW/2;
  p2x = W/2 - PW/2;
  prevP1x = p1x; prevP2x = p2x;
  p1vel = 0; p2vel = 0;
  particles = []; rally = 0; obstacles = []; boostZones = []; dyingBlocks = []; nitroTrail = []; paused = false; document.getElementById('pauseBtn').textContent='⏸';
  hideOverlays();
  running = true;
  startBgm();
  setState('idle', 2); // ball starts at p2 (top = opponent), p1 serves first? no - loser serves
  // First serve: p1 serves (bottom)
  setBallAt(1);
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

function setBallAt(who) {
  // Place ball on paddle of `who`, waiting for movement
  if (who === 1) {
    bx = p1x + PW/2;
    by = H - PH - Math.round(H*0.04) - BR - 2;
  } else {
    bx = p2x + PW/2;
    by = Math.round(H*0.04) + PH + BR + 2;
  }
  bvx = 0; bvy = 0; bspin = 0;
  if (bNitroTimer > 0) { stopNitroSound(); bNitroTimer = 0; bNitroColor = null; preNitroSpd = 0; }
  state = 'idle';
  goalTimer = 0;
}

function launchFrom(who, angle) {
  const spd = H * 0.0048;
  bvx = Math.cos(angle) * spd;
  bvy = (who === 1) ? -Math.abs(Math.sin(angle) * spd) : Math.abs(Math.sin(angle) * spd);
  if (Math.abs(bvy) < spd * 0.3) bvy = (who === 1 ? -1 : 1) * spd * 0.5;
  state = 'playing';
}

function setState(s, who) { state = s; }

// ── LOOP ──
function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function update() {
  const p1y = H - PH - Math.round(H*0.04);
  const p2y = Math.round(H*0.04);

  // Track paddle velocity
  p1vel = p1x - prevP1x;
  p2vel = p2x - prevP2x;
  prevP1x = p1x;
  prevP2x = p2x;

  if (state === 'goal') {
    goalTimer--;
    // Animate particles
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.02;
      return p.life > 0;
    });
    if (goalTimer <= 0) {
      // Give ball to loser
      setBallAt(goalScorer === 1 ? 2 : 1);
    }
    return;
  }

  if (state === 'idle') {
    // Ball follows paddle
    if (goalScorer === 0 || goalScorer === 2) {
      // p1 has ball
      bx = p1x + PW/2;
      by = p1y - BR - 2;
      // launch when p1 moves
      if (Math.abs(p1vel) > 1.5) {
        const angle = Math.atan2(-1, p1vel * 0.6 + (Math.random()-0.5)*0.3);
        launchFrom(1, angle);
      }
    } else {
      // p2 has ball
      bx = p2x + PW/2;
      by = p2y + PH + BR + 2;
      if (mode === 1) {
        // AI launches after short delay - move p2 toward center then launch
        p2x += (W/2 - PW/2 - p2x) * 0.03;
        const timer = Math.random();
        if (timer < 0.015) {
          const angle = Math.atan2(1, (Math.random()-0.5)*0.8);
          launchFrom(2, angle);
        }
      } else {
        if (Math.abs(p2vel) > 1.5) {
          const angle = Math.atan2(1, p2vel * 0.6 + (Math.random()-0.5)*0.3);
          launchFrom(2, angle);
        }
      }
    }
    return;
  }

  // AI for p2 in 1P mode
  if (mode === 1) {
    const center = p2x + PW/2;
    const ai = W * (0.006 + cfg.difficulty * 0.0028);
    if (bvy < 0) { // ball heading up
      if (center < bx - 8) p2x = Math.min(W-PW, p2x + ai);
      else if (center > bx + 8) p2x = Math.max(0, p2x - ai);
    } else {
      p2x += (W/2 - PW/2 - p2x) * 0.04;
    }
  }

  // Move ball
  bvx += bspin * 0.012;
  // slower spin decay during nitro for sustained curve
  bspin *= bNitroTimer > 0 ? 0.992 : 0.97;
  // Nitro decay
  if (bNitroTimer > 0) {
    bNitroTimer--;
    if (bNitroTimer === 0) {
      bNitroColor = null; preNitroSpd = 0;
      stopNitroSound();
    }
  }
  bx += bvx; by += bvy;

  // Side walls
  if (bx - BR < 0) { bx = BR; bvx = Math.abs(bvx); bspin *= -0.5; sndWall(); }
  if (bx + BR > W) { bx = W - BR; bvx = -Math.abs(bvx); bspin *= -0.5; sndWall(); }

  // P1 paddle (bottom)
  if (bvy > 0 && by+BR >= p1y && by+BR <= p1y+PH+8 && bx >= p1x-4 && bx <= p1x+PW+4) {
    const rel = (bx - (p1x + PW/2)) / (PW/2);
    const deflect = rel * 0.9 + p1vel * 0.04;
    const spd = Math.sqrt(bvx*bvx+bvy*bvy) * 1.04;
    const a = Math.atan2(-1, deflect);
    bvx = Math.cos(a) * spd;
    bvy = -Math.abs(Math.sin(a) * spd);
    if (Math.abs(bvy) < spd*0.25) bvy = -spd*0.35;
    by = p1y - BR - 1;
    bspin = p1vel * 0.7;
    capSpeed();
    sndHit();
    onRallyHit();
  }

  // P2 paddle (top)
  if (bvy < 0 && by-BR <= p2y+PH && by-BR >= p2y-8 && bx >= p2x-4 && bx <= p2x+PW+4) {
    const rel = (bx - (p2x + PW/2)) / (PW/2);
    const deflect = rel * 0.9 + p2vel * 0.04;
    const spd = Math.sqrt(bvx*bvx+bvy*bvy) * 1.04;
    const a = Math.atan2(1, deflect);
    bvx = Math.cos(a) * spd;
    bvy = Math.abs(Math.sin(a) * spd);
    if (Math.abs(bvy) < spd*0.25) bvy = spd*0.35;
    by = p2y + PH + BR + 1;
    bspin = p2vel * 0.7;
    capSpeed();
    sndHit();
    onRallyHit();
  }

  checkObstacles();
  checkBoostZones();

  // Goal: ball past bottom = p2 scores, ball past top = p1 scores
  if (by > H + BR) { goal(2); return; }
  if (by < -BR)    { goal(1); return; }
}

function goal(scorer) {
  stopNitroSound(); bNitroTimer=0; bNitroColor=null;
  rally = 0; obstacles = []; boostZones = [];
  if (scorer === 1) { s1++; sndGoal(); } else { s2++; sndLose(); }
  goalScorer = scorer;
  state = 'goal';
  goalTimer = 120; // 2 seconds at 60fps

  // Big burst of particles at the scoring side
  const gy = scorer === 1 ? H * 0.15 : H * 0.85;
  const color = scorer === 1 ? '#00f5ff' : (mode===2?'#ff2d78':'#ffc740');
  // no particles

  if (s1 >= WIN || s2 >= WIN) {
    goalTimer = 180;
    setTimeout(() => endGame(scorer), 3000);
  }
}

function onRallyHit() {
  rally++;
  if (rally === RALLY_THRESHOLD) spawnObstacles();
  if (rally === RALLY_THRESHOLD + 8) spawnBoostZones();
  if (cfg.dynamicBlock && rally === cfg.dynamicAt) spawnMovingBlock();
  if (rally > 0 && rally % 14 === 0) {
    spawnObstacles(); // adds one if under limit
  }
}


function spawnMovingBlock() {
  if (obstacles.some(o => o.moving)) return;
  const ow = Math.round(W * 0.14);
  const oh = Math.round(H * 0.022); // slightly taller = more robust
  obstacles.push({
    x: W/2 - ow/2, y: H/2 - oh/2,
    w: ow, h: oh,
    color: '#7c3aed',    // metallic violet base
    colorHi: '#a78bfa',  // highlight
    colorSh: '#2e1065',  // shadow
    flash: 0,
    ghost: 1.0,
    moving: true,
    vx: W * 0.0012 * (Math.random()<0.5?1:-1), // slow start
    maxVx: W * 0.009   // gradual max
  });
}

function spawnObstacles() {
  const fixed = obstacles.filter(o => !o.moving);
  if (fixed.length >= cfg.maxBlocks || cfg.maxBlocks === 0) return;
  const ow = Math.round(W * 0.12), oh = Math.round(H * 0.015);
  const minDistNitro = W * 0.18; // min distance from any nitro
  let nx, ny, tries = 0, ok = false;
  while (tries < 40) {
    nx = W * (0.1 + Math.random() * 0.8) - ow/2;
    ny = H * (0.22 + Math.random() * 0.56) - oh/2;
    const cx = nx + ow/2, cy = ny + oh/2;
    // check distance from all nitros
    const tooCloseNitro = boostZones.some(z => Math.hypot(cx-z.x, cy-z.y) < minDistNitro);
    // check distance from other blocks
    const tooCloseBlock = obstacles.some(o => Math.abs(cx-(o.x+o.w/2)) < ow*2.5 && Math.abs(cy-(o.y+o.h/2)) < H*0.18);
    if (!tooCloseNitro && !tooCloseBlock) { ok = true; break; }
    tries++;
  }
  if (!ok) return; // couldn't find a valid spot
  obstacles.push({x:nx, y:ny, w:ow, h:oh, color:'#ffc740', flash:0, ghost:1.0});
}

function spawnBoostZones() {
  boostZones = [];
  if (cfg.nitroCount === 0) return;
  const r = Math.round(W * 0.048);
  // Fixed positions per count
  // team1=cyan bottom (y=0.68H), team2=pink top (y=0.32H)
  const y1 = H * 0.68, y2 = H * 0.32;
  const xC = W * 0.5, xL = W * 0.27, xR = W * 0.73;

  // y offsets: center nitro is more "advanced" (closer to center of field)
  const y1C = H * 0.62; // center cyan: closer to middle
  const y1S = H * 0.72; // side cyan: further back
  const y2C = H * 0.38; // center pink: closer to middle
  const y2S = H * 0.28; // side pink: further back

  const configs = {
    1: [{team:1,color:'#00f5ff',x:xC,y:y1C}],
    2: [{team:1,color:'#00f5ff',x:xC,y:y1C},
        {team:2,color:'#ff2d78',x:xC,y:y2C}],
    3: [{team:1,color:'#00f5ff',x:xC,y:y1C},  // center: advanced
        {team:2,color:'#ff2d78',x:xL,y:y2S},  // left side: further
        {team:2,color:'#ff2d78',x:xR,y:y2S}], // right side: further
    4: [{team:1,color:'#00f5ff',x:xL,y:y1S},
        {team:1,color:'#00f5ff',x:xR,y:y1S},
        {team:2,color:'#ff2d78',x:xL,y:y2S},
        {team:2,color:'#ff2d78',x:xR,y:y2S}],
    5: [{team:1,color:'#00f5ff',x:xC,y:y1C},
        {team:1,color:'#00f5ff',x:xL,y:y1S},
        {team:1,color:'#00f5ff',x:xR,y:y1S},
        {team:2,color:'#ff2d78',x:xC,y:y2C},
        {team:2,color:'#ff2d78',x:xL,y:y2S}],
    6: [{team:1,color:'#00f5ff',x:xC,y:y1C},
        {team:1,color:'#00f5ff',x:xL,y:y1S},
        {team:1,color:'#00f5ff',x:xR,y:y1S},
        {team:2,color:'#ff2d78',x:xC,y:y2C},
        {team:2,color:'#ff2d78',x:xL,y:y2S},
        {team:2,color:'#ff2d78',x:xR,y:y2S}],
  };
  const list = configs[Math.min(cfg.nitroCount, 6)] || configs[2];
  list.forEach((d,i) => {
    boostZones.push({x:d.x, y:d.y, r, team:d.team, color:d.color, pulse:i*Math.PI*0.4, cooldown:0});
  });
}

function checkObstacles() {
  obstacles = obstacles.filter(o => {
    // ghost fade in
    if (o.ghost > 0) { o.ghost -= 0.012; if (o.ghost < 0) o.ghost = 0; }
    // no collision while ghosting
    if (!o.ghost || o.ghost < 0.05) {
      if (bx+BR > o.x && bx-BR < o.x+o.w && by+BR > o.y && by-BR < o.y+o.h) {

        if (bNitroTimer > 0) {
          // nitro: pass through if attacking in correct direction, else bounce normally
          const cyanAttacks = bNitroColor === '#00f5ff' && bvy < 0;
          const pinkAttacks = bNitroColor === '#ff2d78' && bvy > 0;
          if (cyanAttacks || pinkAttacks) {
            return true; // pass through - no collision, block stays
          }
          // wrong direction: normal bounce (no destroy)
        }
        const overlapL = (bx+BR) - o.x;
        const overlapR = (o.x+o.w) - (bx-BR);
        const overlapT = (by+BR) - o.y;
        const overlapB = (o.y+o.h) - (by-BR);
        const minO = Math.min(overlapL, overlapR, overlapT, overlapB);
        if (minO === overlapT || minO === overlapB) {
          bvy *= -1;
          // push out vertically to prevent sticking
          if (bvy > 0) by = o.y + o.h + BR + 1;
          else by = o.y - BR - 1;
          bspin += (Math.random()-0.5)*2;
        } else {
          bvx *= -1;
          // push out horizontally
          if (bvx > 0) bx = o.x + o.w + BR + 1;
          else bx = o.x - BR - 1;
        }
        capSpeed(); sndWall();
        o.flash = 8;
      }
    }
    if (o.flash > 0) o.flash--;
    if (o.moving) {
      // gradually accelerate up to maxVx
      const maxV = o.maxVx || W * 0.009;
      if (Math.abs(o.vx) < maxV) {
        o.vx *= 1.0018; // slow ramp up
      }
      o.x += o.vx;
      if (o.x < 0) { o.x = 0; o.vx = Math.abs(o.vx); }
      if (o.x + o.w > W) { o.x = W - o.w; o.vx = -Math.abs(o.vx); }
    }
    return true; // stay forever until fire destroys
  });
}

function checkBoostZones() {
  boostZones.forEach(z => {
    z.pulse += 0.07;
    // cooldown so same orb doesn't trigger repeatedly
    if (z.cooldown > 0) { z.cooldown--; return; }
    if (bNitroTimer > 0 && bNitroColor !== null) return; // already has nitro
    if (Math.hypot(bx - z.x, by - z.y) < z.r + BR) {
      const hitter = bvy < 0 ? 1 : 2;
      const spd = Math.sqrt(bvx*bvx+bvy*bvy);
      const isSameTeam = hitter === z.team;
      if (isSameTeam) {
        const target = Math.min(spd * 1.18, H * 0.013);
        bvx *= target/spd; bvy *= target/spd;
        preNitroSpd = Math.sqrt(bvx*bvx+bvy*bvy);
      preNitroSpd = Math.sqrt(bvx*bvx+bvy*bvy);
      bNitroTimer = NITRO_DURATION;
      bNitroColor = z.color;
      // boost + slight curve deflection on pickup
      const _spd = Math.sqrt(bvx*bvx+bvy*bvy);
      if (_spd > 0) {
        bvx *= 1.6; bvy *= 1.6;
        // small curve: deflect angle by 15-25 degrees toward center
        const curveAngle = (Math.random() * 0.18 + 0.12) * (bx < W/2 ? 1 : -1);
        const cos = Math.cos(curveAngle), sin = Math.sin(curveAngle);
        const nvx = bvx*cos - bvy*sin;
        const nvy = bvx*sin + bvy*cos;
        bvx = nvx; bvy = nvy;
        // add gentle persistent spin so path curves subtly
        bspin = (Math.random()*1.2 + 0.6) * (bx < W/2 ? 1 : -1);
      }
      try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
      // pickup whoosh
      playTone(200,'sawtooth',0.15,0.35);
      playTone(500,'sine',0.12,0.28,0.08);
      playTone(900,'sine',0.09,0.22,0.16);
      startNitroSound();
      } else {
        // wrong team - no effect
      }
      z.cooldown = 60;
    }
  });
}


function capSpeed() {
  const spd = Math.sqrt(bvx*bvx+bvy*bvy);
  const max = H * 0.011;
  if (spd > max) { bvx=bvx/spd*max; bvy=bvy/spd*max; }
}

// ── DRAW ──
function draw() {
  const p1y = H - PH - Math.round(H*0.04);
  const p2y = Math.round(H*0.04);

  ctx.fillStyle = '#06060e'; ctx.fillRect(0,0,W,H);

  // Center dashed line
  ctx.setLineDash([6,12]); ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.setLineDash([]);

  // Scores
  ctx.font = `bold ${Math.round(H*0.12)}px Orbitron,monospace`; ctx.textAlign='center';
  ctx.fillStyle = 'rgba(0,245,255,0.1)';  ctx.fillText(s1, W*0.5, H*0.72);
  ctx.fillStyle = mode===2?'rgba(255,45,120,0.1)':'rgba(255,255,255,0.06)';
  ctx.fillText(s2, W*0.5, H*0.35);

  // "GOAL!" flash
  if (state === 'goal' && goalTimer > 60) {
    const alpha = Math.min(1, (goalTimer-60)/30) * Math.abs(Math.sin(goalTimer*0.25));
    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    ctx.font = `bold ${Math.round(W*0.14)}px Orbitron,monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = goalScorer===1?'#00f5ff':'#ff2d78';
    ctx.shadowColor = goalScorer===1?'#00f5ff':'#ff2d78'; ctx.shadowBlur=30;
    ctx.fillText('GOL!', W/2, H/2 + Math.round(W*0.07));
    ctx.restore();
  }

  // Particles
  particles.forEach(p => {
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8;
    if (p.shape==='rect') ctx.fillRect(p.x-p.r,p.y-p.r/2,p.r*2,p.r);
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  });

  // Boost orbs - stacked neon chevrons
  boostZones.forEach(z => {
    ctx.save();
    const onCooldown = z.cooldown > 0;
    const pulse = onCooldown ? 0.2 : (0.55 + 0.45 * Math.sin(z.pulse));
    const s = z.r * 0.55; // smaller overall
    // cyan (team1) points UP >>> toward opponent; pink (team2) points DOWN <<< toward player
    const dir = z.team === 1 ? 1 : -1; // cyan tip up, pink tip down
    const hw = s * 0.72;  // wider chevron
    const hh = s * 0.52;
    const gap = s * 0.62;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // two vertical neon lines on sides
    const lineH = s * 2.2;
    const lineAlpha = onCooldown ? 0.06 : 0.18 * pulse;
    ctx.globalAlpha = lineAlpha;
    ctx.strokeStyle = z.color;
    ctx.lineWidth = 1;
    ctx.shadowColor = z.color; ctx.shadowBlur = 6;
    const lx1 = z.x - hw - s*0.18;
    const lx2 = z.x + hw + s*0.18;
    ctx.beginPath(); ctx.moveTo(lx1, z.y - lineH/2); ctx.lineTo(lx1, z.y + lineH/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx2, z.y - lineH/2); ctx.lineTo(lx2, z.y + lineH/2); ctx.stroke();

    // 3 chevrons stacked - leading one in direction of travel
    for (let i = 0; i < 3; i++) {
      // cyan(team1) points UP: leading chevron at top → offset goes negative (up)
      // pink(team2) points DOWN: leading chevron at bottom → offset goes positive (down)
      const leading = z.team === 1 ? -1 : 1;
      const offset = i * gap * leading; // 0=base, 1=mid, 2=front(leading)
      const alpha = onCooldown ? 0.1 : pulse * (0.3 + i * 0.28); // front most bright
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = onCooldown ? 2 : (4 + i*5) * pulse;
      ctx.strokeStyle = z.color;
      ctx.lineWidth = onCooldown ? 0.8 : (0.8 + i*0.45);
      const cy2 = z.y + offset;
      // tip direction: up=-1 for cyan, down=+1 for pink
      const tip = z.team === 1 ? -1 : 1;
      ctx.beginPath();
      ctx.moveTo(z.x - hw, cy2 - tip * hh); // left base
      ctx.lineTo(z.x,      cy2 + tip * hh); // center tip
      ctx.lineTo(z.x + hw, cy2 - tip * hh); // right base
      ctx.stroke();
    }
    ctx.restore();
  });

  // Dying blocks - blink out
  dyingBlocks = dyingBlocks.filter(d => {
    if (d.flash > 0) {
      // white flash first
      d.flash--;
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
      ctx.globalAlpha = d.flash / 8;
      ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 4); ctx.fill();
      ctx.restore();
      return true;
    }
    d.blink -= 0.045;
    if (d.blink <= 0) return false;
    ctx.save();
    const show = Math.sin(Date.now() * 0.03) > 0;
    if (show) {
      ctx.globalAlpha = d.blink * 0.45;
      ctx.strokeStyle = d.color;
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 4); ctx.stroke();
    }
    ctx.restore();
    return true;
  });

  // Obstacles
  obstacles.forEach(o => {
    ctx.save();
    const g = o.ghost || 0;
    if (g > 0) {
      // blink while ghost (rapid on/off)
      const blink = Math.sin(Date.now() * 0.02) > 0;
      if (blink) {
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = o.color;
        ctx.lineWidth = 2;
        ctx.shadowColor = o.color; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.stroke();
      }
    } else {
      if (o.moving) {
        // metallic violet - layered look
        ctx.shadowColor = o.flash > 0 ? '#fff' : '#7c3aed';
        ctx.shadowBlur = o.flash > 0 ? 24 : 18;
        // dark base
        ctx.fillStyle = o.flash > 0 ? '#fff' : (o.colorSh || '#2e1065');
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.fill();
        if (!o.flash) {
          // main gradient - metallic
          const mg = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
          mg.addColorStop(0, '#c4b5fd');
          mg.addColorStop(0.2, '#a78bfa');
          mg.addColorStop(0.5, '#7c3aed');
          mg.addColorStop(0.8, '#4c1d95');
          mg.addColorStop(1, '#2e1065');
          ctx.fillStyle = mg;
          ctx.beginPath(); ctx.roundRect(o.x+1, o.y+1, o.w-2, o.h-2, 3); ctx.fill();
          // specular highlight top edge
          const sg = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y);
          sg.addColorStop(0, 'rgba(255,255,255,0)');
          sg.addColorStop(0.3, 'rgba(255,255,255,0.35)');
          sg.addColorStop(0.7, 'rgba(255,255,255,0.35)');
          sg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = sg;
          ctx.beginPath(); ctx.roundRect(o.x+2, o.y+1, o.w-4, o.h*0.35, 2); ctx.fill();
          // outline glow
          ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1;
          ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.fillStyle = o.flash > 0 ? '#fff' : o.color;
        ctx.shadowBlur = 0;
        ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 4); ctx.fill();
      }
    }
    ctx.restore();
  });

  // P2 paddle (top)
  ctx.save();
  ctx.shadowColor = '#ff2d78';
  ctx.shadowBlur = 14;
  ctx.fillStyle = mode===2?'#ff2d78':'#ff2d78';
  rr(p2x, p2y, PW, PH, PH/2);
  ctx.restore();

  // P1 paddle (bottom)
  ctx.save();
  ctx.shadowColor='#00f5ff'; ctx.shadowBlur=16; ctx.fillStyle='#00f5ff';
  rr(p1x, p1y, PW, PH, PH/2);
  ctx.restore();

  // Ball (hidden during goal celebration start)
  if (state !== 'goal' || goalTimer < 90) {
    ctx.save();
    // Nitro trail - neon streak following curve
    if (bNitroTimer > 0 && bNitroColor && state === 'playing') {
      nitroTrail.push({x:bx, y:by, life:1.0, color:bNitroColor, r:BR*0.42});
      if (nitroTrail.length > 18) nitroTrail.shift();
    }
    // draw trail as connected fading line + dots
    if (nitroTrail.length > 1) {
      ctx.save();
      for (let ti = 0; ti < nitroTrail.length; ti++) {
        const t = nitroTrail[ti];
        const fade = (ti+1) / nitroTrail.length;
        ctx.globalAlpha = fade * 0.65;
        ctx.fillStyle = t.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r * fade, 0, Math.PI*2);
        ctx.fill();
      }
      // bright connecting line along trail
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = bNitroColor || '#fff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      nitroTrail.forEach((t,i) => i===0 ? ctx.moveTo(t.x,t.y) : ctx.lineTo(t.x,t.y));
      ctx.stroke();
      ctx.restore();
    }
    // decay trail
    nitroTrail.forEach(t => t.life -= 0.04);
    if (bNitroTimer <= 0) nitroTrail = [];

    const ballR = (bNitroTimer > 0 && bNitroColor) ? BR * 0.68 : BR;
    if (bNitroTimer > 0 && bNitroColor) {
      // super neon - outer glow rings
      const nc = bNitroColor;
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = nc;
      ctx.beginPath(); ctx.arc(bx, by, ballR*1.7, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowColor = nc; ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(bx-ballR*0.25, by-ballR*0.3, ballR*0.05, bx, by, ballR);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.35, nc);
      g.addColorStop(0.8, nc);
      g.addColorStop(1, nc === '#00f5ff' ? '#003366' : '#550022');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI*2); ctx.fill();
      // bright stroke
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.8; ctx.globalAlpha = 0.6;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.shadowColor = '#ffc740'; ctx.shadowBlur = 16;
      const g = ctx.createRadialGradient(bx-BR*0.3, by-BR*0.3, BR*0.1, bx, by, BR);
      g.addColorStop(0, '#fff');
      g.addColorStop(0.4, '#ffc740');
      g.addColorStop(1, '#ff8000');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, ballR, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Ball waiting indicator (idle state)
  if (state === 'idle') {
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.5*Math.sin(Date.now()*0.005);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
    const who = (goalScorer===0||goalScorer===2)?1:2;
    const indicatorY = who===1 ? H-PH-Math.round(H*0.04)-BR*3 : Math.round(H*0.04)+PH+BR*3;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx,indicatorY); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }

  // Labels
  ctx.font=`${Math.round(W*0.024)}px Orbitron,monospace`; ctx.textAlign='right';
  ctx.fillStyle='rgba(0,245,255,0.25)'; ctx.fillText('VOS',W-10,p1y-6);
  if (mode===2) { ctx.fillStyle='rgba(255,45,120,0.25)'; ctx.textAlign='left'; ctx.fillText('J2',10,p2y+PH+16); }
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }

function endGame(scorer) {
  running = false;
  const isP1 = scorer===1;
  const t = document.getElementById('endTitle');
  t.textContent = mode===1?(isP1?'¡GANASTE!':'PERDISTE'):`¡JUGADOR ${scorer} GANA!`;
  t.style.color = isP1?'var(--cyan)':'var(--pink)';
  t.style.filter = `drop-shadow(0 0 20px ${isP1?'var(--cyan)':'var(--pink)'})`;
  document.getElementById('endSub').textContent = `${s1} — ${s2}`;
  showOverlay('ovEnd');
}

let paused = false;

function togglePause() {
  if (!running && !paused) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
  if (paused) {
    stopBgm();
    document.getElementById('pauseScore').textContent = s1 + ' — ' + s2;
    showOverlay('ovPause');
    cancelAnimationFrame(animId);
  } else {
    resumeGame();
  }
}

function resumeGame() {
  paused = false;
  document.getElementById('pauseBtn').textContent = '⏸';
  hideOverlays();
  if (running) { startBgm(); animId = requestAnimationFrame(loop); }
}

function showMenu() { stopBgm(); paused=false; hideOverlays(); showOverlay('ovMenu'); running=false; document.getElementById('pauseBtn').textContent='⏸'; }
function showOverlay(id){ ['ovMenu','ovEnd','ovPause'].forEach(o=>document.getElementById(o).classList.toggle('hidden',o!==id)); }
function hideOverlays(){ ['ovMenu','ovEnd','ovPause'].forEach(o=>document.getElementById(o).classList.add('hidden')); }

// ── TOUCH ──
gc.addEventListener('touchstart', e=>{ ensureNitroLoaded();
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t=>{
    const ty = (t.clientY - gc.getBoundingClientRect().top) * (H/gc.getBoundingClientRect().height);
    if (ty > H/2) { t1id=t.identifier; t1x=t.clientX; }
    else if (mode===2) { t2id=t.identifier; t2x=t.clientX; }
  });
},{passive:false});

gc.addEventListener('touchmove', e=>{
  e.preventDefault();
  const rect = gc.getBoundingClientRect();
  const scaleX = W/rect.width;
  Array.from(e.changedTouches).forEach(t=>{
    const tx = (t.clientX-rect.left)*scaleX;
    const ty = (t.clientY-rect.top)*(H/rect.height);
    if (ty > H/2 || t.identifier===t1id) {
      p1x = Math.max(0, Math.min(W-PW, tx-PW/2));
    } else if (mode===2 || t.identifier===t2id) {
      p2x = Math.max(0, Math.min(W-PW, tx-PW/2));
    }
  });
},{passive:false});

gc.addEventListener('touchend', e=>{ e.preventDefault(); },{passive:false});

// Keyboard
document.addEventListener('keydown', e=>{
  const s = W*0.04;
  if(e.key==='ArrowLeft')  p1x=Math.max(0,p1x-s);
  if(e.key==='ArrowRight') p1x=Math.min(W-PW,p1x+s);
  if(e.key==='a') p2x=Math.max(0,p2x-s);
  if(e.key==='d') p2x=Math.min(W-PW,p2x+s);
});


// ── SOUND ──
const DIFF_LABELS = ['Muy fácil','Fácil','Normal','Difícil','Brutal'];

function setCfg(key, val, labelId, labels) {
  cfg[key] = val;
  const el = document.getElementById(labelId);
  if (el) el.textContent = labels ? labels[val-1] : val;
}

function toggleDyn() {
  cfg.dynamicBlock = !cfg.dynamicBlock;
  document.getElementById('btnDyn').textContent = cfg.dynamicBlock ? '✓ Sí' : '✗ No';
  document.getElementById('dynAtRow').style.opacity = cfg.dynamicBlock ? '1' : '0.3';
}

// init label
setTimeout(()=>{
  setCfg('difficulty',3,'lDiff',DIFF_LABELS);
},0);

let soundOn = true;
let audioCtx = null;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ── BGM: upbeat Mario-style arcade loop ──
let bgmPlaying = false, bgmNoteIdx = 0, bgmTimeoutId = null;

// Relaxed pentatonic BGM - pleasant, not annoying, sine-based
// C pentatonic: C D E G A - naturally consonant, no harsh intervals
const BGM_NOTES = [
  // gentle phrase 1
  [523,0.22],[392,0.22],[440,0.22],[523,0.3],
  [659,0.22],[523,0.22],[440,0.3],[392,0.4],
  // phrase 2 - airy
  [440,0.22],[523,0.22],[659,0.22],[784,0.3],
  [659,0.22],[523,0.22],[392,0.3],[330,0.4],
  // phrase 3 - descending
  [659,0.18],[587,0.18],[523,0.18],[440,0.18],[392,0.3],
  [330,0.18],[392,0.18],[440,0.18],[523,0.35],
  // phrase 4 - resolve
  [523,0.22],[659,0.22],[784,0.22],[880,0.35],
  [784,0.22],[659,0.22],[523,0.22],[392,0.5],
];

function playBgmNote() {
  if (!bgmPlaying) return;
  if (!soundOn || nitroPlaying) {
    bgmTimeoutId = setTimeout(playBgmNote, 60);
    return;
  }
  const [freq, dur] = BGM_NOTES[bgmNoteIdx % BGM_NOTES.length];
  bgmNoteIdx++;
  if (freq > 0) {
    try {
      const ac = getAudio();
      const t = ac.currentTime;
      // lead melody - square
      const o = ac.createOscillator(); const g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.028, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.9);
      o.start(t); o.stop(t + dur);
      // harmony third below every 3 notes
      if (bgmNoteIdx % 3 === 0) {
        const oh = ac.createOscillator(); const gh = ac.createGain();
        oh.connect(gh); gh.connect(ac.destination);
        oh.type = 'sine'; oh.frequency.value = freq * 1.5; // fifth above // minor third down
        gh.gain.setValueAtTime(0.018, t);
        gh.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.6);
        oh.start(t); oh.stop(t + dur * 0.6);
      }
      // punchy bass every 4
      if (bgmNoteIdx % 4 === 0) {
        const ob = ac.createOscillator(); const gb = ac.createGain();
        ob.connect(gb); gb.connect(ac.destination);
        ob.type = 'triangle'; ob.frequency.value = freq * 0.5;
        gb.gain.setValueAtTime(0.015, t);
        gb.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        ob.start(t); ob.stop(t + 0.08);
      }
    } catch(e) {}
  }
  bgmTimeoutId = setTimeout(playBgmNote, dur * 1000);
}

function startBgm() {
  if (bgmPlaying) return;
  bgmPlaying = true; bgmNoteIdx = 0;
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
  playBgmNote();
}

function stopBgm() {
  bgmPlaying = false;
  if (bgmTimeoutId) { clearTimeout(bgmTimeoutId); bgmTimeoutId = null; }
}

function playTone(freq, type, dur, vol, delay=0) {
  if (!soundOn) return;
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.value = freq;
    const t = ac.currentTime + delay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch(e) {}
}

function sndHit()  { playTone(320, 'square', 0.06, 0.35); }
function sndWall() { playTone(200, 'square', 0.06, 0.28); }
function sndGoal() {
  playTone(523, 'triangle', 0.18, 0.4);
  playTone(659, 'triangle', 0.18, 0.4, 0.12);
  playTone(784, 'triangle', 0.22, 0.4, 0.24);
}
function sndLose() {
  playTone(300, 'sawtooth', 0.22, 0.4);
  playTone(220, 'sawtooth', 0.28, 0.4, 0.18);
}

let nitroPlaying = false, nitroIntervalId = null;

let nitroBuffer = null, nitroSource = null, nitroGainNode = null;

function loadNitroAudio() {
  if (nitroBuffer) return;
  try {
    const ac = getAudio();
    const bin = atob(NITRO_AUDIO_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    ac.decodeAudioData(bytes.buffer, buf => { nitroBuffer = buf; });
  } catch(e) { console.log('audio load err', e); }
}

function startNitroSound() {
  if (nitroPlaying) return;
  nitroPlaying = true;
  if (!soundOn) return;
  try {
    const ac = getAudio();
    if (ac.state === 'suspended') ac.resume();
    if (!nitroBuffer) { loadNitroAudio(); return; }
    if (nitroSource) { try { nitroSource.stop(); } catch(e){} }
    nitroGainNode = ac.createGain();
    nitroGainNode.gain.value = 0.85;
    nitroGainNode.connect(ac.destination);
    nitroSource = ac.createBufferSource();
    nitroSource.buffer = nitroBuffer;
    nitroSource.connect(nitroGainNode);
    nitroSource.start(0);
    nitroSource.onended = () => { nitroSource = null; };
  } catch(e) { console.log('nitro play err', e); }
}

function stopNitroSound() {
  if (!nitroPlaying) return;
  nitroPlaying = false;
  if (nitroSource) {
    try { nitroSource.stop(); } catch(e) {}
    nitroSource = null;
  }
}

function updateNitroSound() {
  if (bNitroTimer > 0 && bNitroColor) {
    if (!nitroPlaying) startNitroSound();
  } else {
    if (nitroPlaying) stopNitroSound();
  }
}

// Load nitro audio on first user gesture
function ensureNitroLoaded() { if (!nitroBuffer) loadNitroAudio(); }

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  const audio = document.getElementById('nitroAudio');
  if (audio) audio.volume = soundOn ? 0.8 : 0;
}

window.addEventListener('resize', ()=>{ if(running){ resize(); }});
resize();
</script>
