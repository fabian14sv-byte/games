<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PONG</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06060e;--border:#1a1a35;--cyan:#00f5ff;--pink:#ff2d78;--gold:#ffc740;--text:#e8e8ff;--dim:#3a3a6a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"Share Tech Mono",monospace;color:var(--text);display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);}
  .btn-back{position:fixed;top:14px;left:14px;z-index:500;display:inline-flex;align-items:center;gap:7px;font-family:"Orbitron",sans-serif;font-size:9px;letter-spacing:0.2em;color:var(--dim);text-decoration:none;text-transform:uppercase;padding:8px 14px;border-radius:8px;background:rgba(6,6,14,0.85);border:1px solid var(--border);backdrop-filter:blur(8px);}
  .canvas-wrap{position:relative;flex:1;width:100%;max-width:440px;margin-top:52px;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,6,14,0.92);backdrop-filter:blur(4px);z-index:10;}
  .overlay.hidden{display:none;}
  .overlay-title{font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(22px,5vw,30px);letter-spacing:0.15em;text-align:center;}
  .ot-cyan{color:var(--cyan);filter:drop-shadow(0 0 20px var(--cyan));}
  .overlay-sub{font-size:11px;color:var(--dim);letter-spacing:0.15em;text-align:center;line-height:2;}
  .mode-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn-play{font-family:"Orbitron",sans-serif;font-size:10px;letter-spacing:0.2em;padding:10px 20px;border-radius:8px;border:1px solid var(--cyan);background:rgba(0,245,255,0.1);color:var(--cyan);cursor:pointer;transition:all 0.2s;text-transform:uppercase;-webkit-tap-highlight-color:transparent;}
  .btn-play:active{background:rgba(0,245,255,0.2);}
  .btn-play.p2{border-color:var(--pink);background:rgba(255,45,120,0.1);color:var(--pink);}
</style>
</head>
<body>
<a class="btn-back" href="../../index.html"><span style="font-size:13px">←</span> Inicio</a>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="gc"></canvas>
  <div class="overlay" id="ovStart">
    <div class="overlay-title ot-cyan">PONG</div>
    <div class="overlay-sub">Deslizá el dedo para mover<br>tu paleta</div>
    <div class="mode-btns">
      <button class="btn-play" onclick="startGame(1)">▶ 1 Jugador</button>
      <button class="btn-play p2" onclick="startGame(2)">▶▶ 2 Jugadores</button>
    </div>
  </div>
  <div class="overlay hidden" id="ovWin">
    <div class="overlay-title ot-cyan" id="winTitle"></div>
    <div class="overlay-sub" id="winSub"></div>
    <div class="mode-btns">
      <button class="btn-play" onclick="startGame(lastMode)">↺ Revancha</button>
      <button class="btn-play" onclick="showStart()">⌂ Menú</button>
    </div>
  </div>
</div>
<script>
const gc = document.getElementById('gc');
const ctx = gc.getContext('2d');
let W, H;
let p1x, p2x, bx, by, bvx, bvy, s1, s2, running, mode, lastMode=1, animId;
let p1touch=false, p2touch=false;
const WIN_SCORE = 7;

function resize(){
  const wrap = document.getElementById('canvasWrap');
  W = Math.min(window.innerWidth, 440);
  H = window.innerHeight - 52;
  gc.width = W; gc.height = H;
  wrap.style.height = H + 'px';
}

// Paddle: horizontal bar moving left-right
// p1 at bottom, p2 at top
let PW, PH, BALL_R;

function calcSizes(){
  PW = Math.round(W * 0.25);
  PH = Math.round(H * 0.018);
  BALL_R = Math.round(W * 0.025);
}

function startGame(m){
  lastMode = m; mode = m;
  resize(); calcSizes();
  p1x = W/2 - PW/2;
  p2x = W/2 - PW/2;
  s1 = 0; s2 = 0;
  running = true;
  launchBall();
  hideOverlays();
  if(animId) cancelAnimationFrame(animId);
  loop();
}

function launchBall(){
  bx = W/2; by = H/2;
  const a = (Math.random()*0.5-0.25) + (Math.random()<0.5?Math.PI/2:Math.PI*1.5);
  const spd = H * 0.007;
  bvx = Math.cos(a)*spd; bvy = Math.sin(a)*spd;
}

function loop(){
  if(!running) return;
  update(); draw();
  animId = requestAnimationFrame(loop);
}

function update(){
  const spd = W * 0.014;

  // AI for p2 in 1-player mode
  if(mode === 1){
    const center = p2x + PW/2;
    const ai = spd * 0.75;
    if(bvy < 0){ // ball moving toward p2
      if(center < bx - 10) p2x = Math.min(W-PW, p2x + ai);
      else if(center > bx + 10) p2x = Math.max(0, p2x - ai);
    } else {
      p2x += (W/2 - PW/2 - p2x) * 0.05;
    }
  }

  bx += bvx; by += bvy;

  // Side walls
  if(bx - BALL_R < 0){ bx = BALL_R; bvx = Math.abs(bvx); }
  if(bx + BALL_R > W){ bx = W - BALL_R; bvx = -Math.abs(bvx); }

  // p1 paddle (bottom)
  const p1y = H - PH - Math.round(H*0.04);
  if(bvy > 0 && by+BALL_R >= p1y && by+BALL_R <= p1y+PH+6 && bx >= p1x && bx <= p1x+PW){
    bvy = -Math.abs(bvy) * 1.04;
    const rel = (bx-(p1x+PW/2))/(PW/2);
    bvx = rel * Math.abs(bvy) * 0.8;
    by = p1y - BALL_R - 1;
    capSpeed();
  }

  // p2 paddle (top)
  const p2y = Math.round(H*0.04);
  if(bvy < 0 && by-BALL_R <= p2y+PH && by-BALL_R >= p2y-6 && bx >= p2x && bx <= p2x+PW){
    bvy = Math.abs(bvy) * 1.04;
    const rel = (bx-(p2x+PW/2))/(PW/2);
    bvx = rel * Math.abs(bvy) * 0.8;
    by = p2y + PH + BALL_R + 1;
    capSpeed();
  }

  // Score
  if(by > H){ s2++; if(s2>=WIN_SCORE){ endGame(2); return; } launchBall(); }
  if(by < 0){ s1++; if(s1>=WIN_SCORE){ endGame(1); return; } launchBall(); }
}

function capSpeed(){
  const spd = Math.sqrt(bvx*bvx+bvy*bvy);
  const max = H * 0.016;
  if(spd > max){ bvx=bvx/spd*max; bvy=bvy/spd*max; }
}

function draw(){
  ctx.fillStyle = '#06060e'; ctx.fillRect(0,0,W,H);

  const p1y = H - PH - Math.round(H*0.04);
  const p2y = Math.round(H*0.04);

  // center line
  ctx.setLineDash([6,10]); ctx.strokeStyle='rgba(255,255,255,0.07)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.setLineDash([]);

  // scores
  ctx.font = `bold ${Math.round(W*0.14)}px Orbitron,monospace`; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.fillText(s2, W/2, H*0.35);
  ctx.fillText(s1, W/2, H*0.72);

  // paddles
  ctx.save();
  // p2 (top) - opponent color
  ctx.shadowColor = mode===2?'#ff2d78':'rgba(255,255,255,0.3)';
  ctx.shadowBlur = 14;
  ctx.fillStyle = mode===2?'#ff2d78':'rgba(150,150,180,0.7)';
  roundRect(ctx, p2x, p2y, PW, PH, PH/2);

  // p1 (bottom) - player color
  ctx.shadowColor='#00f5ff'; ctx.shadowBlur=14; ctx.fillStyle='#00f5ff';
  roundRect(ctx, p1x, p1y, PW, PH, PH/2);
  ctx.restore();

  // ball
  ctx.save();
  ctx.shadowColor='#ffc740'; ctx.shadowBlur=16;
  const g=ctx.createRadialGradient(bx-BALL_R*0.3,by-BALL_R*0.3,BALL_R*0.1,bx,by,BALL_R);
  g.addColorStop(0,'#fff'); g.addColorStop(0.4,'#ffc740'); g.addColorStop(1,'#ff8c00');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,BALL_R,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // "VOS" label
  ctx.font = `${Math.round(W*0.025)}px Orbitron,monospace`;
  ctx.fillStyle='rgba(0,245,255,0.3)'; ctx.textAlign='right';
  ctx.fillText('VOS', W-10, p1y-6);
  if(mode===2){ ctx.fillStyle='rgba(255,45,120,0.3)'; ctx.textAlign='left'; ctx.fillText('J2', 10, p2y+PH+16); }
}

function roundRect(c,x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); c.fill(); }

function endGame(winner){
  running=false; cancelAnimationFrame(animId);
  const isP1 = winner===1;
  document.getElementById('winTitle').textContent = mode===1?(isP1?'¡GANASTE!':'PERDISTE'):`¡JUGADOR ${winner} GANA!`;
  document.getElementById('winTitle').style.color = isP1?'var(--cyan)':'var(--pink)';
  document.getElementById('winSub').textContent = `${s1} — ${s2}`;
  showOverlay('ovWin');
}

function showStart(){ hideOverlays(); showOverlay('ovStart'); }
function showOverlay(id){ ['ovStart','ovWin'].forEach(o=>document.getElementById(o).classList.toggle('hidden',o!==id)); }
function hideOverlays(){ ['ovStart','ovWin'].forEach(o=>document.getElementById(o).classList.add('hidden')); }

// Touch controls - drag finger to move p1 paddle
gc.addEventListener('touchstart', e=>{
  e.preventDefault();
}, {passive:false});

gc.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!running) return;
  const rect = gc.getBoundingClientRect();
  // support up to 2 touches for 2-player
  Array.from(e.touches).forEach(t=>{
    const tx = (t.clientX - rect.left) * (W / rect.width);
    const ty = (t.clientY - rect.top) * (H / rect.height);
    if(ty > H/2){ // bottom half = p1
      p1x = Math.max(0, Math.min(W-PW, tx - PW/2));
    } else if(mode===2){ // top half = p2
      p2x = Math.max(0, Math.min(W-PW, tx - PW/2));
    }
  });
}, {passive:false});

// Keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft')  p1x = Math.max(0, p1x - W*0.04);
  if(e.key==='ArrowRight') p1x = Math.min(W-PW, p1x + W*0.04);
  if(e.key==='a') p2x = Math.max(0, p2x - W*0.04);
  if(e.key==='d') p2x = Math.min(W-PW, p2x + W*0.04);
});

window.addEventListener('resize', ()=>{ if(running){ resize(); calcSizes(); }});
resize();
</script>
</body>
</html>
